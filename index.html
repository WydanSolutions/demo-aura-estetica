  const cobradoMes = movMes.reduce((s, m) => s + m.monto, 0);
  const varMes = antTramo ? Math.round((cobradoMes - antTramo) / antTramo * 100) : 0;
  const bajos = D().productos.filter(p => estadoStock(p) !== 'ok');

  const kpis = `<div class="grid g-4 revelar">
    <div class="kpi"><div class="kpi-l">${ico('agenda')} Turnos de hoy</div><div class="kpi-v">${activosHoy.length}</div>
      <div class="kpi-d">${realizados} realizados · ${activosHoy.length - realizados} por atender</div></div>
    <div class="kpi"><div class="kpi-l">${ico('dinero')} Cobrado hoy</div><div class="kpi-v">${pesos(movHoy.reduce((s, m) => s + m.monto, 0))}</div>
      <div class="kpi-d">${movHoy.length} ${movHoy.length === 1 ? 'cobro' : 'cobros'}</div></div>
    <div class="kpi"><div class="kpi-l">${ico('finanzas')} Cobrado en el mes</div><div class="kpi-v">${pesos(cobradoMes)}</div>
      <div class="kpi-d">${antTramo && Math.abs(varMes) < 1 ? 'Igual que a esta altura del mes pasado' : antTramo ? `<span class="${varMes >= 0 ? 'pos' : 'neg'}">${varMes >= 0 ? '▲' : '▼'} ${Math.abs(varMes)} %</span> vs. el mismo día del mes pasado` : MESES[aFecha(h).getMonth()]}</div></div>
    <div class="kpi ${bajos.length ? 'alerta' : ''}" style="cursor:pointer" onclick="STK.soloBajo=true; ir('stock')"><div class="kpi-l">${ico('stock')} Stock bajo</div><div class="kpi-v">${bajos.length}</div>
      <div class="kpi-d">${bajos.filter(p => p.tipo === 'venta').length} de venta · ${bajos.filter(p => p.tipo === 'insumo').length} insumos</div></div>
  </div>`;

  /* Próximo turno */
  let prox = activosHoy.find(t => t.estado !== 'realizado' && finTurno(t) > ahora), esManana = false;
  if (!prox){ prox = turnosDelDia(man).filter(turnoActivo)[0]; esManana = !!prox; }
  let proxHtml = '';
  if (prox){
    const c = cliente(prox.cli), s = servicio(prox.serv), al = alertasCliente(c);
    const enCurso = !esManana && minutos(prox.hora) <= ahora;
    proxHtml = `<div class="proximo revelar">
      <div class="proximo-l">${enCurso ? 'En curso ahora' : (esManana ? 'Próximo turno · mañana' : 'Próximo turno')}</div>
      <div class="fila-fin" style="align-items:flex-end">
        <div><div class="proximo-h">${prox.hora}</div>
          <div class="proximo-n">${esc(c.nombre)}</div>
          <div class="proximo-s">${esc(s.nombre)} · ${prox.dur} min · con ${nombreProf(prox.prof)}</div></div>
        ${chipEstadoTurno(prox.estado)}
      </div>
      ${al.length ? `<div class="caja-info alerta mt-s">${ico('alerta')}<div><b>Atención:</b> ${al.map(esc).join(' · ')}</div></div>` : ''}
      <div class="fila">
        <button class="btn btn-oro btn-sm" onclick="verTurno('${prox.id}')">Ver turno</button>
        <button class="btn btn-linea btn-sm" onclick="verCliente('${c.id}')">Ver ficha</button>
        <button class="btn btn-wa btn-sm" onclick="recordarTurno('${prox.id}')">${ico('wa')} WhatsApp</button>
      </div></div>`;
  }

  /* Línea de tiempo de hoy */
  const linea = deHoy.length ? deHoy.map(t => {
    const c = cliente(t.cli), s = servicio(t.serv), ahoraEs = turnoActivo(t) && t.estado !== 'realizado' && minutos(t.hora) <= ahora && finTurno(t) > ahora;
    return `<div class="lt-item st-${t.estado} ${ahoraEs ? 'ahora' : ''}" onclick="verTurno('${t.id}')">
      <div class="lt-hora">${t.hora}<small>${hhmm(finTurno(t))}</small></div><div class="lt-punto"></div>
      <div><div class="lt-n">${esc(c.nombre)} ${alertasCliente(c).length ? `<span class="alerta-mini" style="color:var(--mal)" title="${esc(alertasCliente(c).join(' · '))}">${ico('alerta')}</span>` : ''}</div>
        <div class="lt-s"><span class="prof-dot" style="background:${colorProf(t.prof)}"></span>${esc(s.nombre)} · ${nombreProf(t.prof)}</div></div>
      <div>${chipEstadoTurno(t.estado)}</div></div>`;
  }).join('') : `<div class="vacio">${ico('agenda')}Hoy no hay turnos agendados.</div>`;

  /* Recordatorios de mañana */
  const deMan = turnosDelDia(man).filter(turnoActivo);
  const faltan = deMan.filter(t => !t.rec).length;
  const recs = deMan.length ? deMan.map(t => {
    const c = cliente(t.cli);
    return `<div class="lm-item ${t.rec ? 'hecho' : ''}"><div class="avatar">${iniciales(c.nombre)}</div>
      <div class="lm-txt"><div class="lm-t">${t.hora} · ${esc(c.nombre)}</div><div class="lm-s">${esc(servicio(t.serv).nombre)}</div></div>
      ${t.rec ? `<span class="chip c-ok">Enviado</span>` : `<button class="btn btn-wa btn-xs" onclick="recordarTurno('${t.id}')">${ico('wa')} Enviar</button>`}</div>`;
  }).join('') : `<div class="vacio">No hay turnos para mañana.</div>`;

  /* Controles de tratamientos */
  const ctrls = D().tratamientos.map(t => ({ t, i:infoTrat(t) }))
    .filter(x => x.i.estado === 'atrasado' || (x.i.estado === 'curso' && difDias(h, x.i.proximo) <= 7))
    .sort((a, b) => a.i.proximo.localeCompare(b.i.proximo));
  const ctrlHtml = ctrls.length ? ctrls.map(({ t, i }) => {
    const c = cliente(t.cli);
    return `<div class="lm-item"><div class="avatar">${iniciales(c.nombre)}</div>
      <div class="lm-txt" style="cursor:pointer" onclick="verTratamiento('${t.id}')"><div class="lm-t">${esc(c.nombre)}</div>
        <div class="lm-s">${esc(servicio(t.serv).nombre)} · sesión ${i.hechas + 1} de ${t.total}</div></div>
      ${i.estado === 'atrasado' ? `<span class="chip c-mal">Atrasado ${i.atraso} d</span>` : `<span class="chip c-conf">${cuando(i.proximo)}</span>`}
      <button class="btn btn-wa btn-xs" onclick="recordarControl('${t.id}')" aria-label="Avisar por WhatsApp">${ico('wa')}</button></div>`;
  }).join('') : `<div class="vacio">No hay controles para esta semana.</div>`;

  /* Cumpleaños de la semana */
  const cumples = D().clientes.filter(c => c.nac && difDias(h, proximoCumple(c.nac)) <= 7)
    .sort((a, b) => proximoCumple(a.nac).localeCompare(proximoCumple(b.nac)));
  const cumpleHtml = cumples.length ? cumples.map(c => {
    const f = proximoCumple(c.nac);
    return `<div class="lm-item"><div class="avatar">${ico('torta')}</div>
      <div class="lm-txt"><div class="lm-t">${esc(c.nombre)}</div><div class="lm-s">${f === h ? '¡Hoy! ' : fLarga(f) + ' · '}cumple ${edad(c.nac) + (f === h ? 0 : 1)}</div></div>
      <button class="btn btn-wa btn-xs" onclick="saludarCumple('${c.id}')">${ico('wa')} Saludar</button></div>`;
  }).join('') : `<div class="vacio">No hay cumpleaños esta semana.</div>`;

  /* Stock bajo */
  const stockHtml = bajos.length ? bajos.slice(0, 6).map(p => `<div class="lm-item">
      <div class="lm-txt"><div class="lm-t">${esc(p.nombre)}</div><div class="lm-s">${p.tipo === 'venta' ? 'Producto de venta' : 'Insumo de cabina'} · quedan ${p.stock} (mínimo ${p.min})</div></div>
      ${chipStock(p)}</div>`).join('') + (bajos.length > 6 ? `<div class="mt-s"><a class="link" href="#stock" onclick="STK.soloBajo=true">Ver los ${bajos.length} →</a></div>` : '')
    : `<div class="vacio">Todo el stock está bien.</div>`;

  /* Clientas para reactivar */
  const idx = indiceClientes();
  const inactivas = D().clientes.filter(c => esInactiva(idx[c.id]) && idx[c.id].ultima).sort((a, b) => idx[b.id].ultima.localeCompare(idx[a.id].ultima));
  const reactHtml = inactivas.length ? inactivas.slice(0, 5).map(c => `<div class="lm-item"><div class="avatar">${iniciales(c.nombre)}</div>
      <div class="lm-txt" style="cursor:pointer" onclick="verCliente('${c.id}')"><div class="lm-t">${esc(c.nombre)}</div><div class="lm-s">Última visita ${cuando(idx[c.id].ultima)}</div></div>
      <button class="btn btn-wa btn-xs" onclick="invitarVolver('${c.id}')">${ico('wa')} Invitar</button></div>`).join('')
    : `<div class="vacio">Todas tus clientas vinieron en los últimos ${D().config.diasInactiva} días.</div>`;

  /* Pagos al personal */
  const pagos = proximosPagosPersonal();
  const pagosHtml = pagos.map(p => `<div class="aviso-pago"><div class="dias"><b>${Math.max(0, difDias(h, p.fecha))}</b><span>días</span></div>
      <div class="lm-txt"><div class="lm-t">${p.titulo}</div><div class="lm-s">${p.detalle}</div></div></div>`).join('');

  $('#vista').innerHTML = kpis + `<div class="panel-grid">
    <div class="panel-col">
      ${proxHtml}
      <div class="card revelar"><div class="card-cab"><div class="card-t">Turnos de hoy <span class="card-num">${activosHoy.length}</span><small>${fLarga(h)}</small></div>
        <a class="link" href="#agenda" onclick="AG.vista='dia'; AG.fecha=hoy()">Ver agenda →</a></div><div class="linea">${linea}</div></div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Controles de tratamientos<small>Atrasados o de esta semana</small></div>
        <a class="link" href="#tratamientos">Ver todos →</a></div><div class="lista-mini">${ctrlHtml}</div></div>
    </div>
    <div class="panel-col">
      <div class="card revelar"><div class="card-cab"><div class="card-t">Recordar turnos de mañana ${faltan ? `<span class="card-num">${faltan} sin enviar</span>` : ''}<small>${fLarga(man)}</small></div></div>
        <div class="lista-mini">${recs}</div></div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Pagos al personal<small>Cálculo orientativo</small></div><a class="link" href="#personal">Personal →</a></div>${pagosHtml}</div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Cumpleaños de la semana</div></div><div class="lista-mini">${cumpleHtml}</div></div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Stock bajo</div><a class="link" href="#stock" onclick="STK.soloBajo=true">Stock →</a></div><div class="lista-mini">${stockHtml}</div></div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Para reactivar<small>Hace más de ${D().config.diasInactiva} días que no vienen</small></div></div><div class="lista-mini">${reactHtml}</div></div>
    </div></div>`;
};


/* ===== js/08-agenda.js ===== */
/* =====================================================================
   AGENDA · vistas diaria, semanal, mensual y anual
   ===================================================================== */
const AG = { vista:'dia', fecha:null, prof:'', estado:'' };
const PPM = 1.35;   // píxeles por minuto en las vistas de día y semana

function filtrarTurnos(lista){ return lista.filter(t => (!AG.prof || t.prof === AG.prof) && (!AG.estado || t.estado === AG.estado)); }
function rangoAgenda(){   // desde / hasta de la vista actual
  const f = AG.fecha;
  if (AG.vista === 'dia') return [f, f];
  if (AG.vista === 'semana'){ const i = inicioSemana(f); return [i, sumarDias(i, 6)]; }
  if (AG.vista === 'mes') return [inicioMes(f), finMes(f)];
  const y = f.slice(0, 4); return [y + '-01-01', y + '-12-31'];
}
function etiquetaAgenda(){
  const f = AG.fecha, d = aFecha(f);
  if (AG.vista === 'dia') return fLarga(f);
  if (AG.vista === 'semana'){ const [a, b] = rangoAgenda(); const da = aFecha(a), db = aFecha(b);
    return da.getDate() + (da.getMonth() !== db.getMonth() ? ' ' + MESES_C[da.getMonth()] : '') + ' – ' + db.getDate() + ' ' + MESES_C[db.getMonth()]; }
  if (AG.vista === 'mes') return MESES[d.getMonth()] + ' ' + d.getFullYear();
  return String(d.getFullYear());
}
function moverAgenda(n){
  const v = AG.vista;
  AG.fecha = v === 'dia' ? sumarDias(AG.fecha, n) : v === 'semana' ? sumarDias(AG.fecha, 7 * n) : v === 'mes' ? sumarMeses(AG.fecha, n) : sumarMeses(AG.fecha, 12 * n);
  RENDER.agenda();
}
function verDia(f){ AG.vista = 'dia'; AG.fecha = f; RENDER.agenda(); window.scrollTo(0, 0); }

RENDER.agenda = function(){
  if (!AG.fecha) AG.fecha = hoy();
  encabezado('Agenda', 'Tocá un espacio libre para agendar, o un turno para verlo.',
    btnExportar('exportarAgenda') + `<button class="btn btn-oro" onclick="nuevoTurno({fecha:AG.fecha})">${ico('mas')} Nuevo turno</button>`);
  const vistas = [['dia','Día'],['semana','Semana'],['mes','Mes'],['anio','Año']];
  const herr = `<div class="ag-herr">
    <div class="fila">
      <div class="segmento" role="tablist">${vistas.map(([k, t]) => `<button class="${AG.vista === k ? 'on' : ''}" onclick="AG.vista='${k}'; RENDER.agenda()">${t}</button>`).join('')}</div>
      <div class="navfecha"><button class="icon-btn" onclick="moverAgenda(-1)" aria-label="Anterior">${ico('izq')}</button>
        <span class="lbl">${etiquetaAgenda()}</span>
        <button class="icon-btn" onclick="moverAgenda(1)" aria-label="Siguiente">${ico('der')}</button></div>
      <button class="btn btn-linea btn-sm" onclick="AG.fecha=hoy(); RENDER.agenda()">Hoy</button>
    </div>
    <div class="fila">
      <select class="sel" onchange="AG.prof=this.value; RENDER.agenda()"><option value="">Todas las profesionales</option>
        ${D().profesionales.map(p => `<option value="${p.id}" ${AG.prof === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>
      <select class="sel" onchange="AG.estado=this.value; RENDER.agenda()"><option value="">Todos los estados</option>
        ${Object.keys(ESTADOS_TURNO).map(k => `<option value="${k}" ${AG.estado === k ? 'selected' : ''}>${ESTADOS_TURNO[k].t}</option>`).join('')}</select>
    </div></div>`;
  const cuerpo = AG.vista === 'dia' ? vistaDia() : AG.vista === 'semana' ? vistaSemana() : AG.vista === 'mes' ? vistaMes() : vistaAnio();
  const ley = `<div class="leyenda">${D().profesionales.map(p => `<span><i style="background:${colorProf(p.id)}"></i>${esc(p.nombre)}</span>`).join('')}
    <span style="margin-left:auto"></span>${Object.keys(ESTADOS_TURNO).map(k => `<span><i class="dot-${k}"></i>${ESTADOS_TURNO[k].t}</span>`).join('')}</div>`;
  $('#vista').innerHTML = herr + `<div class="ag-caja">${cuerpo}${AG.vista === 'anio' ? '' : ley}</div>`;
  if (AG.vista === 'dia' || AG.vista === 'semana'){   // desplazar hasta la hora actual en celular
    const sc = $('.ag-scroll'); if (sc && AG.vista === 'semana'){ const hoyCol = $('.ag-cab.hoy'); if (hoyCol) sc.scrollLeft = Math.max(0, hoyCol.offsetLeft - 60); }
  }
};

/* Rango de horas a mostrar: el horario de atención (o más, si hay turnos fuera de hora) */
function rangoHoras(ts){
  const hor = D().config.horario;
  let a = minutos(hor.desde), b = minutos(hor.hasta);
  ts.forEach(t => { a = Math.min(a, minutos(t.hora)); b = Math.max(b, finTurno(t)); });
  return [Math.floor(a / 60) * 60, Math.ceil(b / 60) * 60];
}
function columnaHoras(ini, fin){
  let h = '';
  for (let m = ini; m <= fin; m += 60) h += `<div class="ag-hora" style="top:${(m - ini) * PPM}px">${hhmm(m)}</div>`;
  return `<div class="ag-horas" style="height:${(fin - ini) * PPM}px">${h}</div>`;
}
function lineasHoras(ini, fin){
  let h = '';
  for (let m = ini; m < fin; m += 30) h += `<div class="ag-linea ${m % 60 ? 'media' : ''}" style="top:${(m - ini) * PPM}px"></div>`;
  return h;
}
function lineaAhora(f, ini, fin){ const a = ahoraMin(); return f === hoy() && a >= ini && a <= fin ? `<div class="ag-ahora" style="top:${(a - ini) * PPM}px"></div>` : ''; }
function bloqueTurno(t, ini, estilo, corto){
  const c = cliente(t.cli), s = servicio(t.serv), al = alertasCliente(c).length;
  const alto = Math.max(t.dur * PPM - 3, 24);
  return `<div class="turno ${claseProf(t.prof)} st-${t.estado}" style="top:${(minutos(t.hora) - ini) * PPM + 1}px;height:${alto}px;${estilo}"
      onclick="event.stopPropagation(); verTurno('${t.id}')" title="${esc(t.hora + ' ' + c.nombre + ' · ' + s.nombre)}">
    <span class="tst dot-${t.estado}"></span>
    <div class="tn">${al ? `<span class="alerta-mini">${ico('alerta')}</span>` : ''}${corto ? t.hora + ' ' : ''}${esc(corto ? primerNombre(c.nombre) + ' ' + (c.nombre.split(' ')[1] || '').charAt(0) + '.' : c.nombre)}</div>
    ${alto > 34 ? `<div class="ts">${corto ? esc(s.nombre) : t.hora + '–' + hhmm(finTurno(t)) + ' · ' + esc(s.nombre)}</div>` : ''}</div>`;
}
function clicColumna(ev, f, prof){
  const r = ev.currentTarget.getBoundingClientRect();
  let m = AG._ini + (ev.clientY - r.top) / PPM;
  m = Math.floor(m / 15) * 15;
  nuevoTurno({ fecha:f, hora:hhmm(m), prof: prof || (AG.prof || 'p1') });
}

function vistaDia(){
  const f = AG.fecha, profs = D().profesionales.filter(p => !AG.prof || p.id === AG.prof);
  const ts = filtrarTurnos(turnosDelDia(f));
  const [ini, fin] = rangoHoras(ts); AG._ini = ini;
  const cerrado = !D().config.horario.dias.includes(diaSemana(f));
  const alto = (fin - ini) * PPM;
  let html = `<div class="ag-scroll"><div class="ag-grilla" style="grid-template-columns:58px repeat(${profs.length}, minmax(170px, 1fr))">
    <div class="ag-cab"></div>` +
    profs.map(p => `<div class="ag-cab"><span class="prof-dot" style="background:${colorProf(p.id)}"></span>${esc(p.nombre)}
      <div class="muted" style="font-weight:500;font-size:11px">${ts.filter(t => t.prof === p.id && turnoActivo(t)).length} turnos</div></div>`).join('') +
    columnaHoras(ini, fin) +
    profs.map(p => `<div class="ag-col ${cerrado ? 'cerrado' : ''}" style="height:${alto}px" onclick="clicColumna(event,'${f}','${p.id}')">
      ${lineasHoras(ini, fin)}${lineaAhora(f, ini, fin)}
      ${ts.filter(t => t.prof === p.id).map(t => bloqueTurno(t, ini, 'left:5px;right:5px')).join('')}</div>`).join('') +
    `</div></div>`;
  if (cerrado) html = `<div class="caja-info" style="border-radius:0">${ico('info')}<div>Este día el centro está cerrado (según el horario de atención). Igual podés agendar si hace falta.</div></div>` + html;
  return html;
}

function vistaSemana(){
  const ini0 = inicioSemana(AG.fecha), h = hoy();
  const dias = []; for (let i = 0; i < 7; i++) dias.push(sumarDias(ini0, i));
  const hor = D().config.horario;
  const todos = filtrarTurnos(D().turnos.filter(t => t.fecha >= dias[0] && t.fecha <= dias[6]));
  const visibles = dias.filter(f => hor.dias.includes(diaSemana(f)) || todos.some(t => t.fecha === f));
  const [ini, fin] = rangoHoras(todos); AG._ini = ini;
  const alto = (fin - ini) * PPM, dos = !AG.prof;
  return `<div class="ag-scroll"><div class="ag-grilla" style="grid-template-columns:58px repeat(${visibles.length}, minmax(112px, 1fr))">
    <div class="ag-cab"></div>` +
    visibles.map(f => `<div class="ag-cab ${f === h ? 'hoy' : ''}" style="cursor:pointer" onclick="verDia('${f}')">${DIAS_C[diaSemana(f)]}<b>${aFecha(f).getDate()}</b></div>`).join('') +
    columnaHoras(ini, fin) +
    visibles.map(f => `<div class="ag-col" style="height:${alto}px" onclick="clicColumna(event,'${f}')">
      ${lineasHoras(ini, fin)}${lineaAhora(f, ini, fin)}
      ${todos.filter(t => t.fecha === f).map(t => bloqueTurno(t, ini, dos ? (claseProf(t.prof) === 'p2' ? 'left:50%;right:3px' : 'left:3px;right:50%;margin-right:1px') : 'left:4px;right:4px', true)).join('')}</div>`).join('') +
    `</div></div>`;
}

function vistaMes(){
  const f = AG.fecha, m = aFecha(f).getMonth(), h = hoy();
  let dia = inicioSemana(inicioMes(f)); const fin = finMes(f);
  let celdas = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x => `<div class="mes-dsem">${x}</div>`).join('');
  const todos = filtrarTurnos(D().turnos);
  while (dia <= fin || diaSemana(dia) !== 1){
    const ts = todos.filter(t => t.fecha === dia).sort(ordenTurno), act = ts.filter(turnoActivo);
    celdas += `<div class="mes-dia ${aFecha(dia).getMonth() !== m ? 'fuera' : ''} ${dia === h ? 'hoy' : ''}" onclick="verDia('${dia}')">
      <div class="mes-n">${aFecha(dia).getDate()}</div>
      ${ts.slice(0, 3).map(t => `<div class="mes-t ${claseProf(t.prof)} st-${t.estado}">${t.hora} ${esc(primerNombre(cliente(t.cli).nombre))}</div>`).join('')}
      ${ts.length > 3 ? `<div class="mes-mas">+${ts.length - 3} más</div>` : ''}
      ${act.length ? `<div class="mes-cuenta">${act.length}</div>` : ''}</div>`;
    dia = sumarDias(dia, 1);
    if (dia > fin && diaSemana(dia) === 1) break;
  }
  return `<div class="mes-grilla">${celdas}</div>`;
}

function vistaAnio(){
  const y = aFecha(AG.fecha).getFullYear(), h = hoy();
  const cuenta = {};
  filtrarTurnos(D().turnos).forEach(t => { if (t.fecha.startsWith(y) && turnoActivo(t)) cuenta[t.fecha] = (cuenta[t.fecha] || 0) + 1; });
  let html = '';
  for (let m = 0; m < 12; m++){
    const ini = y + '-' + p2(m + 1) + '-01', off = (diaSemana(ini) + 6) % 7, fin = finMes(ini);
    const total = Object.keys(cuenta).filter(k => k.slice(5, 7) === p2(m + 1)).reduce((s, k) => s + cuenta[k], 0);
    let g = ['L','M','M','J','V','S','D'].map(x => `<span class="h">${x}</span>`).join('') + '<span></span>'.repeat(off);
    for (let dd = ini; dd <= fin; dd = sumarDias(dd, 1)){
      const n = cuenta[dd] || 0, niv = n === 0 ? '' : n <= 3 ? 'n1' : n <= 5 ? 'n2' : n <= 7 ? 'n3' : 'n4';
      g += `<span class="${niv} ${dd === h ? 'hoy' : ''}" onclick="verDia('${dd}')" title="${fCorta(dd)}: ${n} turnos">${aFecha(dd).getDate()}</span>`;
    }
    html += `<div><div class="am-t" onclick="AG.vista='mes'; AG.fecha='${ini}'; RENDER.agenda()">${MESES[m]} <span class="muted" style="font-family:var(--f-cuerpo);font-size:11.5px">${total} turnos</span></div><div class="am-g">${g}</div></div>`;
  }
  return `<div class="anio-grilla">${html}</div><div class="leyenda"><span>Turnos por día:</span>
    <span><i style="background:#F7ECE5;border-radius:3px"></i>1–3</span><span><i style="background:#EFD8CA;border-radius:3px"></i>4–5</span>
    <span><i style="background:#DDB29C;border-radius:3px"></i>6–7</span><span><i style="background:var(--oro-osc);border-radius:3px"></i>8 o más</span></div>`;
}

function exportarAgenda(){
  const [a, b] = rangoAgenda();
  const ts = filtrarTurnos(D().turnos.filter(t => t.fecha >= a && t.fecha <= b)).sort(ordenTurno);
  exportarCSV('Agenda ' + etiquetaAgenda(), ['Fecha','Hora','Duración (min)','Clienta','Teléfono','Servicio','Profesional','Estado','Precio','Recordatorio enviado','Nota'],
    ts.map(t => { const c = cliente(t.cli); return [fCorta(t.fecha), t.hora, t.dur, c.nombre, c.tel, servicio(t.serv).nombre, profesional(t.prof).nombre, ESTADOS_TURNO[t.estado].t, t.precio, t.rec ? 'Sí' : 'No', t.nota]; }));
}

function nuevoTurno(pre){
  pre = pre || {};
  const h = hoy();
  const base = { cli:'', serv:'', prof:'p1', fecha:h, hora:'', dur:60, precio:0, estado:'pendiente', rec:false, nota:'' };
  if (!pre.hora){ const m = Math.max(minutos(D().config.horario.desde), Math.ceil(ahoraMin() / 30) * 30); base.hora = (pre.fecha && pre.fecha !== h) ? D().config.horario.desde : hhmm(Math.min(m, minutos('18:00'))); }
  FT = { t: Object.assign(base, pre), nuevo:true };
  if (FT.t.serv){ const s = servicio(FT.t.serv); if (!pre.dur) FT.t.dur = s.dur; if (!pre.precio) FT.t.precio = s.precio; }
  formTurno();
}
function editarTurno(id){ FT = { t: turno(id), nuevo:false }; formTurno(); }

async function guardarTurno(){
  const v = leerForm($('#f-turno'));
  if (!v.cli) return avisar('Elegí la clienta', 'alerta');
  if (!v.serv) return avisar('Elegí el servicio', 'alerta');
  if (!v.fecha || !v.hora) return avisar('Completá la fecha y la hora', 'alerta');
  const t = FT.t, previo = FT.nuevo ? null : t.estado;
  const n = Object.assign({}, t, { cli:v.cli, serv:v.serv, prof:v.prof, fecha:v.fecha, hora:v.hora,
    dur:Number(v.dur) || servicio(v.serv).dur, precio:Number(v.precio) || 0, estado:v.estado, nota:v.nota });
  // Controles: horario de atención y superposición con otro turno de la misma profesional
  const hor = D().config.horario, avisos = [];
  if (!hor.dias.includes(diaSemana(n.fecha))) avisos.push('Ese día el centro está <b>cerrado</b>.');
  else if (minutos(n.hora) < minutos(hor.desde) || finTurno(n) > minutos(hor.hasta)) avisos.push(`Queda <b>fuera del horario</b> de atención (${hor.desde} a ${hor.hasta}).`);
  const sup = turnoActivo(n) ? superposicion(n) : null;
  if (sup) avisos.push(`Se <b>superpone</b> con el turno de ${esc(cliente(sup.cli).nombre)} (${sup.hora} a ${hhmm(finTurno(sup))}) de ${nombreProf(sup.prof)}.`);
  if (avisos.length && !(await confirmar('¿Guardar igual?', avisos.join('<br>'), 'Guardar igual'))) return;

  if (!FT.nuevo && (t.fecha !== n.fecha || t.hora !== n.hora)) n.rec = false;   // se movió: hay que volver a avisar
  const pasaARealizado = n.estado === 'realizado' && previo !== 'realizado';
  if (pasaARealizado) n.estado = previo || 'confirmado';
  if (FT.nuevo){ n.id = Store.id('t'); D().turnos.push(n); } else Object.assign(t, n);
  guardar();
  if (pasaARealizado){ refrescar(); marcarRealizado(n.id); return; }
  cerrarModal(); refrescar();
  avisar(FT.nuevo ? 'Turno agendado para el ' + fLarga(n.fecha) + ' a las ' + n.hora : 'Turno actualizado', 'agenda');
}
async function borrarTurno(id){
  if (!(await confirmar('¿Eliminar este turno?', 'Se borra de la agenda. Si ya tenía un cobro registrado, el cobro queda en Finanzas.', 'Eliminar', true))) return;
  D().turnos = D().turnos.filter(t => t.id !== id); guardar(); cerrarModal(); refrescar(); avisar('Turno eliminado', 'borrar');
}
async function cambiarEstado(id, e){
  const t = turno(id);
  if (e === 'cancelado' && !(await confirmar('¿Cancelar el turno?', 'Queda en la agenda como «Cancelado» y el horario se libera.', 'Cancelar turno', true))) return;
  t.estado = e; guardar(); refrescar(); verTurno(id);
  avisar('Turno: ' + ESTADOS_TURNO[e].t.toLowerCase());
}

function marcarRealizado(id){

      ${tr ? `<div class="form-sep">Sesión del tratamiento</div>
        <div class="ancho">${check('regSesion', true, `Registrar como <b>sesión ${tr.sesiones.length + 1} de ${tr.total}</b>`)}</div>
        ${campo('Parámetros usados', inp('param', ult, 'text', 'placeholder="Ej.: fluencia, tiempo, producto…"'), { ancho:true })}
        ${campo('Nota de evolución', area('notaSes', '', 'placeholder="Cómo respondió, qué se ajustó…"'), { ancho:true })}` : ''}
      <div class="form-sep">Cobro</div>
      ${pack ? `<div class="ancho caja-info">${ico('info')}<div>Esta sesión ya está <b>pagada por adelantado</b> (pack de ${tr.total} sesiones). No hace falta cobrarla.</div></div>` : ''}
      <div class="ancho">${check('cobrar', !pack, pack ? 'Cobrar igual un adicional' : 'Registrar el cobro', 'onchange="mostrarCamposCobro(this.checked)"')}</div>
      <div id="cobro-campos" class="ancho form" style="${pack ? 'display:none' : ''}">
        ${campo('Monto', inp('monto', t.precio, 'number', 'min="0" step="50"'), { ayuda:'Sugerido: el precio del servicio' })}
        ${campo('Medio de pago', sel('medio', MEDIOS_PAGO, 'Efectivo'))}
      </div></form>`,
    pie: `<button class="btn btn-linea" onclick="verTurno('${id}')">Volver</button><button class="btn btn-oro" onclick="confirmarRealizado('${id}')">${ico('ok')} Confirmar</button>`
  });
}
function mostrarCamposCobro(v){ $('#cobro-campos').style.display = v ? '' : 'none'; }
function confirmarRealizado(id){
  const t = turno(id), s = servicio(t.serv), tr = tratActivo(t.cli, t.serv), v = leerForm($('#f-cobro'));
  t.estado = 'realizado';
  let msg = 'Turno realizado';
  if (v.cobrar && Number(v.monto) > 0){
    nuevoMov({ fecha:t.fecha, tipo:'ing', cat:'Servicios', concepto:s.nombre, monto:v.monto, medio:v.medio, cli:t.cli, serv:t.serv, turno:t.id });
    msg += ' · cobro de ' + pesos(v.monto);
  }
  if (tr && v.regSesion){
    tr.sesiones.push({ fecha:t.fecha, n:0, prof:t.prof, param:v.param, nota:v.notaSes, turno:t.id });
    tr.sesiones.sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach((x, i) => x.n = i + 1);
    t.trat = tr.id;
    if (tr.sesiones.length >= tr.total){ tr.estado = 'finalizado'; msg += ' · ¡tratamiento completo!'; }
    else msg += ' · sesión ' + tr.sesiones.length + ' de ' + tr.total;
  }
  guardar(); cerrarModal(); refrescar(); avisar(msg);
}

/* =====================================================================

   ===================================================================== */
const CL = { q:'', filtro:'todas', lim:40, tab:'historial' };
const FILTROS_CLI = [['todas','Todas'],['alerta','Con alertas'],['trat','En tratamiento'],['nuevas','Nuevas (30 días)'],['inactivas','Inactivas'],['cumple','Cumplen este mes']];

function clientesFiltradas(idx){
  const q = CL.q.toLowerCase(), h = hoy(), mes = aFecha(h).getMonth();
  const enTrat = new Set(D().tratamientos.filter(t => ['curso','atrasado'].includes(infoTrat(t).estado)).map(t => t.cli));
  return D().clientes.filter(c => {
    if (q && !(c.nombre.toLowerCase().includes(q) || c.tel.replace(/\s/g, '').includes(q.replace(/\s/g, '')))) return false;
    const st = idx[c.id];
    switch (CL.filtro){
      case 'alerta': return alertasCliente(c).length > 0;
      case 'trat': return enTrat.has(c.id);
      case 'nuevas': return difDias(c.alta, h) <= 30;
      case 'inactivas': return esInactiva(st);
      case 'cumple': return c.nac && aFecha(c.nac).getMonth() === mes;
    }
    return true;
  }).sort((a, b) => a.nombre.localeCompare(b.nombre));
}

};

  const idx = indiceClientes(), lista = clientesFiltradas(idx), h = hoy();

  $('#cli-filtros').innerHTML = FILTROS_CLI.map(([k, t]) => `<button class="pildora ${CL.filtro === k ? 'on' : ''}" onclick="CL.filtro='${k}'; CL.lim=40; pintarClientes()">${t} <span class="n">${cuenta[k]}</span></button>`).join('');
  const filas = lista.slice(0, CL.lim).map(c => {
    const st = idx[c.id], cumple = c.nac && difDias(h, proximoCumple(c.nac)) <= 7;
    return `<div class="fila-cli" onclick="verCliente('${c.id}')">

function htmlHistorial(c){
  const items = D().turnos.filter(t => t.cli === c.id).map(t => ({ f:t.fecha + t.hora, fecha:t.fecha, t:servicio(t.serv).nombre,
      s:t.hora + ' · con ' + nombreProf(t.prof) + (t.trat ? ' · sesión de tratamiento' : ''), d:chipEstadoTurno(t.estado) + (t.estado === 'realizado' ? ` <span class="num fuerte" style="margin-left:6px">${pesos(t.precio)}</span>` : ''), id:t.id }))
    .concat(D().movs.filter(m => m.cli === c.id && (m.cat === 'Venta de productos' || m.cat === 'Packs de tratamientos'))
      .map(m => ({ f:m.fecha + '99', fecha:m.fecha, t:m.concepto, s:m.cat + ' · ' + m.medio, d:`<span class="num fuerte">${pesos(m.monto)}</span>` })))
    .sort((a, b) => b.f.localeCompare(a.f));
  if (!items.length) return `<div class="vacio">Todavía no tiene visitas.</div>`;
  return items.slice(0, 60).map(i => `<div class="hist-item" ${i.id ? `style="cursor:pointer" onclick="verTurno('${i.id}')"` : ''}>
      <div><div class="fuerte">${fMedia(i.fecha)}</div><div class="persona-s">${DIAS[diaSemana(i.fecha)]}</div></div>
      <div><div class="fuerte">${esc(i.t)}</div><div class="persona-s">${esc(i.s)}</div></div><div class="derecha">${i.d}</div></div>`).join('') +

}

function guardarCliente(id){
  const v = leerForm($('#f-cli'));

async function borrarCliente(id){
  const tiene = D().turnos.some(t => t.cli === id);
  if (tiene) return confirmar('No se puede eliminar', 'Tiene turnos en su historial. Para no perder la información, queda guardada.', 'Entendido');
  if (!(await confirmar('¿Eliminar a esta persona?', 'Se borra de la base de clientes.', 'Eliminar', true))) return;
  D().clientes = D().clientes.filter(c => c.id !== id); guardar(); cerrarModal(); refrescar(); avisar('Eliminado', 'borrar');
}

  });
}
function guardarFicha(id){

/* =====================================================================

const TRT = { filtro:'todos', q:'' };
const ORDEN_TRAT = { atrasado:0, curso:1, pausado:2, finalizado:3 };

RENDER.tratamientos = function(){
  encabezado('Tratamientos', 'Planes por sesiones: avance, próximos controles y packs pagados por adelantado.',
    btnExportar('exportarTratamientos') + `<button class="btn btn-oro" onclick="formTratamiento()">${ico('mas')} Nuevo tratamiento</button>`);
  const h = hoy(), todos = D().tratamientos.map(t => ({ t, i:infoTrat(t) }));
  const cnt = e => todos.filter(x => x.i.estado === e).length;
  const semana = todos.filter(x => x.i.estado === 'curso' && difDias(h, x.i.proximo) <= 7).length;
  const prepagas = todos.filter(x => x.t.prepago && (x.i.estado === 'curso' || x.i.estado === 'atrasado')).reduce((s, x) => s + (x.t.total - x.i.hechas), 0);
  const q = TRT.q.toLowerCase();
  const lista = todos.filter(x => (TRT.filtro === 'todos' || x.i.estado === TRT.filtro) &&
      (!q || cliente(x.t.cli).nombre.toLowerCase().includes(q) || x.t.nombre.toLowerCase().includes(q)))
    .sort((a, b) => ORDEN_TRAT[a.i.estado] - ORDEN_TRAT[b.i.estado] || String(a.i.proximo || '').localeCompare(String(b.i.proximo || '')));
  const filtros = [['todos','Todos', todos.length], ['curso','En curso', cnt('curso')], ['atrasado','Control atrasado', cnt('atrasado')], ['finalizado','Finalizados', cnt('finalizado')], ['pausado','Pausados', cnt('pausado')]];

  $('#vista').innerHTML = `<div class="grid g-4 revelar">
      <div class="kpi"><div class="kpi-l">${ico('tratamientos')} En curso</div><div class="kpi-v">${cnt('curso') + cnt('atrasado')}</div><div class="kpi-d">tratamientos activos</div></div>
      <div class="kpi ${cnt('atrasado') ? 'alerta' : ''}"><div class="kpi-l">${ico('alerta')} Controles atrasados</div><div class="kpi-v">${cnt('atrasado')}</div><div class="kpi-d">para avisar por WhatsApp</div></div>
      <div class="kpi"><div class="kpi-l">${ico('agenda')} Esta semana</div><div class="kpi-v">${semana}</div><div class="kpi-d">controles que tocan</div></div>
      <div class="kpi"><div class="kpi-l">${ico('dinero')} Sesiones prepagas</div><div class="kpi-v">${prepagas}</div><div class="kpi-d">ya cobradas, por realizar</div></div>
    </div>
    <div class="herr mt">
      <div class="buscar">${ico('buscar')}<input type="search" placeholder="Buscar clienta o tratamiento…" value="${esc(TRT.q)}" oninput="TRT.q=this.value; RENDER.tratamientos(); const i=$('#vista input[type=search]'); i.focus(); i.setSelectionRange(i.value.length,i.value.length)"></div>
      <div class="pildoras">${filtros.map(([k, t, n]) => `<button class="pildora ${TRT.filtro === k ? 'on' : ''}" onclick="TRT.filtro='${k}'; RENDER.tratamientos(); activarRevelado()">${t} <span class="n">${n}</span></button>`).join('')}</div>
    </div>
    <div class="trat-grid">${lista.length ? lista.map(({ t, i }) => tarjetaTrat(t, i)).join('') : `<div class="vacio card" style="grid-column:1/-1">${ico('tratamientos')}No hay tratamientos con ese filtro.</div>`}</div>`;
};
function tarjetaTrat(t, i){
  const c = cliente(t.cli);
  let prox = '';
  if (i.estado === 'atrasado') prox = `<span class="neg fuerte">Control atrasado ${i.atraso} ${i.atraso === 1 ? 'día' : 'días'}</span>`;
  else if (i.estado === 'curso') prox = `Próximo control: <b>${fMedia(i.proximo)}</b> <span class="muted">(${cuando(i.proximo)})</span>`;
  else if (i.estado === 'finalizado') prox = `<span class="pos">Completado el ${fMedia(i.ult)}</span>`;
  else prox = '<span class="muted">En pausa</span>';
  const avisable = i.estado === 'atrasado' || (i.estado === 'curso' && difDias(hoy(), i.proximo) <= 7);
  return `<div class="trat revelar" onclick="verTratamiento('${t.id}')">
    <div class="fila-fin"><div class="persona"><div class="avatar">${iniciales(c.nombre)}</div><div><div class="persona-n">${esc(c.nombre)}</div><div class="persona-s">${esc(servicio(t.serv).cat)}</div></div></div>
      ${chipEstadoTrat(i.estado)}</div>
    <div class="trat-t">${esc(t.nombre)}</div>
    <div><div class="trat-prog"><span>Sesión <b>${i.hechas}</b> de ${t.total}</span><span>${i.pct} %</span></div>
      <div class="avance ${i.estado === 'atrasado' ? 'mal' : i.estado === 'finalizado' ? 'ok' : ''}"><span style="width:${i.pct}%"></span></div></div>
    <div class="puntos">${Array.from({ length:t.total }, (_, k) => `<i class="${k < i.hechas ? 'h' : ''}"></i>`).join('')}</div>
    <div style="font-size:12.5px">${prox}</div>
    <div class="trat-pie"><div class="fila">${t.prepago ? '<span class="chip c-oro sin-punto">Pack pagado</span>' : ''}<span class="muted" style="font-size:11.5px">cada ${t.frec} días</span></div>
      <div class="fila">
        ${avisable ? `<button class="btn btn-wa btn-xs" onclick="event.stopPropagation(); recordarControl('${t.id}')">${ico('wa')} Avisar</button>` : ''}
        ${i.estado === 'curso' || i.estado === 'atrasado' ? `<button class="btn btn-suave btn-xs" onclick="event.stopPropagation(); formSesion('${t.id}')">${ico('mas')} Sesión</button>` : ''}</div></div>
  </div>`;
}

      <div class="mt"><div class="trat-prog" style="font-size:14px"><span>Sesión <b>${i.hechas}</b> de ${t.total}</span><span>${i.pct} %</span></div>
        <div class="avance ${i.estado === 'atrasado' ? 'mal' : i.estado === 'finalizado' ? 'ok' : ''}" style="height:10px"><span style="width:${i.pct}%"></span></div></div>
      <div class="ficha-datos">
        <div><div class="dato-l">Servicio</div><div class="dato-v">${esc(s.nombre)}</div></div>
        <div><div class="dato-l">Frecuencia</div><div class="dato-v">cada ${t.frec} días</div></div>
        <div><div class="dato-l">Próximo control</div><div class="dato-v">${i.proximo ? fCorta(i.proximo) : '—'}</div></div>
      </div>

async function estadoTrat(id, e){
  if (e === 'finalizado' && !(await confirmar('¿Finalizar el tratamiento?', 'Queda como «Finalizado» aunque no se hayan hecho todas las sesiones.', 'Finalizar'))) return;
  tratamiento(id).estado = e; guardar(); refrescar(); verTratamiento(id); avisar('Tratamiento: ' + ESTADOS_TRAT[e].t.toLowerCase());
}

/* ---------- Nuevo / editar ---------- */
function formTratamiento(id, cliPre){

  const servs = D().servicios.filter(s => s.activo || s.id === t.serv).sort((a, b) => (b.sesiones - a.sesiones) || a.nombre.localeCompare(b.nombre));
  abrirModal({
    titulo: id ? 'Editar tratamiento' : 'Nuevo tratamiento',
    sub: id ? esc(t.nombre) : 'Un plan de varias sesiones, vinculado a la clienta.', ancho:'md',
    cuerpo: `<form class="form" id="f-trat" onsubmit="return false">
      ${campo('Clienta', sel('cli', [['', 'Elegí la clienta…']].concat(D().clientes.slice().sort((a, b) => a.nombre.localeCompare(b.nombre)).map(c => [c.id, c.nombre])), t.cli), { ancho:true })}
      ${campo('Servicio', sel('serv', [['', 'Elegí el servicio…']].concat(servs.map(s => [s.id, s.nombre + (s.sesiones ? ' · ' + s.sesSug + ' ses. c/' + s.frec + ' días' : '')])), t.serv, 'onchange="alCambiarServTrat()"'), { ancho:true })}
      ${campo('Cantidad de sesiones', inp('total', t.total, 'number', 'min="1" oninput="sugerirPack()"'))}
      ${campo('Cada cuántos días', inp('frec', t.frec, 'number', 'min="1"'))}
      ${campo('Fecha de inicio', inp('inicio', t.inicio, 'date'))}
      ${id ? campo('Estado', sel('estado', [['curso','En curso'],['pausado','Pausado'],['finalizado','Finalizado']], t.estado)) : '<div></div>'}
      ${campo('Nota', area('nota', t.nota, 'placeholder="Objetivo, zona, indicaciones…"'), { ancho:true })}
      ${id ? (t.prepago ? `<div class="ancho caja-info">${ico('dinero')}<div>Pack pagado por adelantado: <b>${pesos(t.montoPack)}</b>. Las sesiones no se vuelven a cobrar.</div></div>` : '') : `
        <div class="form-sep">Pago</div>
        <div class="ancho">${check('prepago', false, '<b>Pagado por adelantado</b> (pack): al realizar cada sesión no se pide un cobro nuevo', 'onchange="$(\'#pack-campos\').style.display=this.checked?\'\':\'none\'; sugerirPack()"')}</div>
        <div id="pack-campos" class="ancho form" style="display:none">
          ${campo('Monto del pack', inp('montoPack', '', 'number', 'min="0" step="100"'), { ayuda:'<span id="pack-ayuda"></span>' })}
          ${campo('Medio de pago', sel('medio', MEDIOS_PAGO, 'Transferencia'))}
        </div>`}
      </form>`,
    pie: (id ? `<button class="btn btn-peligro izq" onclick="borrarTratamiento('${id}')">${ico('borrar')} Eliminar</button>` : '') +
      `<button class="btn btn-linea" onclick="${id ? `verTratamiento('${id}')` : 'cerrarModal()'}">Cancelar</button><button class="btn btn-oro" onclick="guardarTratamiento('${id || ''}')">Guardar</button>`
  });
}
function alCambiarServTrat(){
  const s = servicio($('#f-trat [name=serv]').value); if (!s) return;
  if (s.sesiones){ $('#f-trat [name=total]').value = s.sesSug; $('#f-trat [name=frec]').value = s.frec; }
  sugerirPack();
}
function sugerirPack(){
  const f = $('#f-trat'), s = servicio(f.querySelector('[name=serv]').value), m = f.querySelector('[name=montoPack]');
  if (!s || !m) return;
  const lista = s.precio * Number(f.querySelector('[name=total]').value || 0), sug = Math.round(lista * .85 / 100) * 100;
  m.value = sug;
  $('#pack-ayuda').textContent = 'Precio de lista ' + pesos(lista) + ' · sugerido con 15 % de descuento';
}
function guardarTratamiento(id){
  const v = leerForm($('#f-trat'));
  if (!v.cli || !v.serv) return avisar('Elegí la clienta y el servicio', 'alerta');
  if (!(v.total > 0) || !(v.frec > 0)) return avisar('Revisá la cantidad de sesiones y la frecuencia', 'alerta');
  const s = servicio(v.serv), nombre = s.nombre + ' · ' + v.total + ' sesiones';
  if (id){
    const t = tratamiento(id);
    Object.assign(t, { cli:v.cli, serv:v.serv, total:v.total, frec:v.frec, inicio:v.inicio, estado:v.estado, nota:v.nota, nombre });
    guardar(); refrescar(); verTratamiento(id); return avisar('Tratamiento actualizado');
  }
  const t = { id:Store.id('tr'), cli:v.cli, serv:v.serv, nombre, total:v.total, frec:v.frec, inicio:v.inicio || hoy(), estado:'curso',
    prepago:!!v.prepago, montoPack:v.prepago ? Number(v.montoPack) || 0 : 0, sesiones:[], nota:v.nota };
  D().tratamientos.push(t);
  if (t.prepago && t.montoPack > 0) nuevoMov({ fecha:hoy(), tipo:'ing', cat:'Packs de tratamientos', concepto:'Pack ' + t.total + ' sesiones · ' + s.nombre, monto:t.montoPack, medio:v.medio, cli:t.cli, trat:t.id });
  guardar(); refrescar(); verTratamiento(t.id);
  avisar(t.prepago ? 'Tratamiento creado y pack cobrado' : 'Tratamiento creado', 'tratamientos');
}
async function borrarTratamiento(id){
  if (!(await confirmar('¿Eliminar el tratamiento?', 'Se borra el plan y sus sesiones. Los cobros quedan en Finanzas.', 'Eliminar', true))) return;
  D().tratamientos = D().tratamientos.filter(t => t.id !== id); D().turnos.forEach(t => { if (t.trat === id) delete t.trat; });
  guardar(); cerrarModal(); refrescar(); avisar('Tratamiento eliminado', 'borrar');
}

/* ---------- Registrar sesión (sin pasar por la agenda) ---------- */
function formSesion(id){
  const t = tratamiento(id), s = servicio(t.serv), n = t.sesiones.length + 1;
  const ult = t.sesiones.length ? t.sesiones[t.sesiones.length - 1] : null;
  abrirModal({
    titulo: 'Registrar sesión ' + n + ' de ' + t.total, sub: esc(cliente(t.cli).nombre) + ' · ' + esc(s.nombre),
    cuerpo: `<form class="form" id="f-ses" onsubmit="return false">
      ${campo('Fecha', inp('fecha', hoy(), 'date'))}
      ${campo('Profesional', sel('prof', D().profesionales.map(p => [p.id, p.nombre]), ult ? ult.prof : 'p1'))}
      ${campo('Parámetros usados', inp('param', ult ? ult.param : '', 'text', 'placeholder="Ej.: fluencia, tiempo, producto…"'), { ancho:true })}
      ${campo('Nota de evolución', area('nota', '', 'placeholder="Cómo respondió, cambios que se notan…"'), { ancho:true })}
      <div class="ancho">${check('agenda', true, 'Anotarla también en la agenda como turno realizado')}</div>
      ${t.prepago ? `<div class="ancho caja-info">${ico('info')}<div>Pagada por adelantado (pack): no se cobra.</div></div>` : `
        <div class="ancho">${check('cobrar', true, 'Registrar el cobro', 'onchange="$(\'#ses-cobro\').style.display=this.checked?\'\':\'none\'"')}</div>
        <div id="ses-cobro" class="ancho form">${campo('Monto', inp('monto', s.precio, 'number', 'min="0" step="50"'))}${campo('Medio de pago', sel('medio', MEDIOS_PAGO, 'Efectivo'))}</div>`}
      </form>`,
    pie: `<button class="btn btn-linea" onclick="verTratamiento('${id}')">Cancelar</button><button class="btn btn-oro" onclick="guardarSesion('${id}')">${ico('ok')} Registrar sesión</button>`
  });
}
function guardarSesion(id){
  const t = tratamiento(id), s = servicio(t.serv), v = leerForm($('#f-ses'));
  if (!v.fecha) return avisar('Poné la fecha', 'alerta');
  let tu = null;
  if (v.agenda){
    const hora = hhmm(Math.min(Math.max(Math.floor(ahoraMin() / 15) * 15, minutos('09:00')), minutos('18:00')));
    tu = { id:Store.id('t'), fecha:v.fecha, hora, dur:s.dur, cli:t.cli, serv:t.serv, prof:v.prof, estado:'realizado', precio:s.precio, rec:true, nota:'Sesión registrada desde Tratamientos', trat:t.id };
    D().turnos.push(tu);
  }
  if (!t.prepago && v.cobrar && Number(v.monto) > 0)
    nuevoMov({ fecha:v.fecha, tipo:'ing', cat:'Servicios', concepto:s.nombre, monto:v.monto, medio:v.medio, cli:t.cli, serv:t.serv, turno:tu ? tu.id : null });
  t.sesiones.push({ fecha:v.fecha, n:0, prof:v.prof, param:v.param, nota:v.nota, turno:tu ? tu.id : null });
  t.sesiones.sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach((x, i) => x.n = i + 1);
  if (t.sesiones.length >= t.total) t.estado = 'finalizado';
  guardar(); refrescar(); verTratamiento(id);
  avisar(t.estado === 'finalizado' ? '¡Tratamiento completo!' : 'Sesión ' + t.sesiones.length + ' de ' + t.total + ' registrada');
}

}

/* =====================================================================
   FINANZAS · ingresos, egresos y resultados
   ===================================================================== */
const FIN = { vista:'mes', fecha:null, tipo:'', cat:'', medio:'', q:'', lim:50 };

function rangoFin(){
  const f = FIN.fecha;
  if (FIN.vista === 'dia') return [f, f];
  if (FIN.vista === 'mes') return [inicioMes(f), finMes(f)];
  const y = f.slice(0, 4); return [y + '-01-01', y + '-12-31'];
}
function etiquetaFin(){ const d = aFecha(FIN.fecha); return FIN.vista === 'dia' ? fLarga(FIN.fecha) : FIN.vista === 'mes' ? MESES[d.getMonth()] + ' ' + d.getFullYear() : String(d.getFullYear()); }
function moverFin(n){ FIN.fecha = FIN.vista === 'dia' ? sumarDias(FIN.fecha, n) : FIN.vista === 'mes' ? sumarMeses(FIN.fecha, n) : sumarMeses(FIN.fecha, 12 * n); FIN.lim = 50; RENDER.finanzas(); }
function movsFiltrados(){
  const [a, b] = rangoFin(), q = FIN.q.toLowerCase();
  return D().movs.filter(m => m.fecha >= a && m.fecha <= b && (!FIN.tipo || m.tipo === FIN.tipo) && (!FIN.cat || m.cat === FIN.cat) &&
    (!FIN.medio || m.medio === FIN.medio) && (!q || m.concepto.toLowerCase().includes(q) || (m.cli && cliente(m.cli) && cliente(m.cli).nombre.toLowerCase().includes(q))))
    .sort((x, y) => y.fecha.localeCompare(x.fecha));
}

RENDER.finanzas = function(){
  if (!FIN.fecha) FIN.fecha = hoy();
  encabezado('Finanzas', 'Ingresos automáticos de los turnos y ventas, más los que cargues a mano.',
    btnExportar('exportarFinanzas') +
    `<button class="btn btn-linea" onclick="formMov('egr')">${ico('gasto')} Registrar gasto</button>
     <button class="btn btn-oro" onclick="formMov('ing')">${ico('dinero')} Registrar cobro</button>`);
  if (FIN.modo === 'flujo'){ $('#vista').innerHTML = pestanasFin() + htmlFlujo(); return; }
  const [a, b] = rangoFin();
  const conRetiros = D().movs.filter(m => m.fecha >= a && m.fecha <= b);
  const retiros = conRetiros.filter(m => m.cat === CAT_RETIRO).reduce((s, m) => s + m.monto, 0);
  const enRango = conRetiros.filter(m => m.cat !== CAT_RETIRO);   // los retiros de la dueña no son gastos del negocio
  const ing = sumaMovs(enRango, 'ing'), egr = sumaMovs(enRango, 'egr'), res = ing - egr;
  const cobrosServ = enRango.filter(m => m.tipo === 'ing' && m.cat === 'Servicios');
  const ticket = cobrosServ.length ? cobrosServ.reduce((s, m) => s + m.monto, 0) / cobrosServ.length : 0;

  // Servicios que más facturan (en el período)
  const porServ = {};
  enRango.filter(m => m.tipo === 'ing' && m.serv).forEach(m => { porServ[m.serv] = porServ[m.serv] || { n:0, t:0 }; porServ[m.serv].n++; porServ[m.serv].t += m.monto; });
  const top = Object.keys(porServ).map(k => ({ s:servicio(k), ...porServ[k] })).filter(x => x.s).sort((x, y) => y.t - x.t).slice(0, 6);
  const maxTop = top.length ? top[0].t : 1;
  // Egresos por categoría
  const porCat = {};
  enRango.filter(m => m.tipo === 'egr').forEach(m => porCat[m.cat] = (porCat[m.cat] || 0) + m.monto);
  const cats = Object.keys(porCat).sort((x, y) => porCat[y] - porCat[x]), maxCat = cats.length ? porCat[cats[0]] : 1;
  // Ingresos por medio de pago
  const porMedio = {}; enRango.filter(m => m.tipo === 'ing').forEach(m => porMedio[m.medio] = (porMedio[m.medio] || 0) + m.monto);

  const barra = (t, v, max, extra, color) => `<div class="barra-h"><div class="fila-fin"><span>${t}</span><span class="num fuerte">${pesos(v)}${extra ? ` <span class="muted" style="font-weight:500">${extra}</span>` : ''}</span></div>
    <div class="avance"><span style="width:${Math.max(2, v / max * 100)}%;${color ? 'background:' + color : ''}"></span></div></div>`;

  const lista = movsFiltrados();
  $('#vista').innerHTML = pestanasFin() + `<div class="ag-herr">
      <div class="fila"><div class="segmento">${[['dia','Día'],['mes','Mes'],['anio','Año']].map(([k, t]) => `<button class="${FIN.vista === k ? 'on' : ''}" onclick="FIN.vista='${k}'; FIN.lim=50; RENDER.finanzas()">${t}</button>`).join('')}</div>
        <div class="navfecha"><button class="icon-btn" onclick="moverFin(-1)" aria-label="Anterior">${ico('izq')}</button><span class="lbl">${etiquetaFin()}</span>
          <button class="icon-btn" onclick="moverFin(1)" aria-label="Siguiente">${ico('der')}</button></div>
        <button class="btn btn-linea btn-sm" onclick="FIN.fecha=hoy(); RENDER.finanzas()">Hoy</button></div></div>
    <div class="grid g-4 revelar">
      <div class="kpi"><div class="kpi-l">${ico('dinero')} Ingresos</div><div class="kpi-v pos">${pesos(ing)}</div><div class="kpi-d">${enRango.filter(m => m.tipo === 'ing').length} movimientos</div></div>
      <div class="kpi"><div class="kpi-l">${ico('gasto')} Egresos</div><div class="kpi-v">${pesos(egr)}</div><div class="kpi-d">${enRango.filter(m => m.tipo === 'egr').length} movimientos${retiros ? ' · aparte, retiros ' + pesos(retiros) : ''}</div></div>
      <div class="kpi ${res < 0 ? 'alerta' : ''}"><div class="kpi-l">${ico('finanzas')} Resultado</div><div class="kpi-v ${res >= 0 ? 'pos' : ''}">${pesos(res)}</div><div class="kpi-d">${ing ? 'margen ' + pct(res / ing * 100) : '—'}</div></div>
      <div class="kpi"><div class="kpi-l">${ico('estrella')} Ticket promedio</div><div class="kpi-v">${pesos(ticket)}</div><div class="kpi-d">por servicio cobrado</div></div>
    </div>
    <div class="grid mt" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)" id="fin-g1">
      <div class="card revelar"><div class="card-cab"><div class="card-t">Ingresos vs. egresos<small>${FIN.vista === 'anio' ? 'Mes a mes, ' + FIN.fecha.slice(0, 4) : 'Últimos 6 meses'}</small></div>
        <div class="graf-ley"><span><i style="background:var(--oro)"></i>Ingresos</span><span><i style="background:#DCD3C9"></i>Egresos</span></div></div>${graficoFin()}</div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Servicios que más facturan<small>${etiquetaFin()}</small></div></div>
        ${top.length ? top.map(x => barra(esc(x.s.nombre), x.t, maxTop, '· ' + x.n)).join('') : '<div class="vacio">Sin servicios cobrados en este período.</div>'}</div>
    </div>
    <div class="grid g-2 mt">
      <div class="card revelar"><div class="card-cab"><div class="card-t">Egresos por categoría</div></div>
        ${cats.length ? cats.map(c => barra(esc(c), porCat[c], maxCat, '', '#C9B8A8')).join('') : '<div class="vacio">Sin egresos en este período.</div>'}</div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Cobros por medio de pago</div></div>
        ${MEDIOS_PAGO.map(m => barra(m, porMedio[m] || 0, Math.max(1, ...Object.values(porMedio)), ing ? '· ' + pct((porMedio[m] || 0) / ing * 100) : '')).join('')}</div>
    </div>
    <div class="card-cab mt" style="margin-top:28px"><div class="card-t">Movimientos <span class="card-num">${lista.length}</span></div></div>
    <div class="herr">
      <div class="buscar">${ico('buscar')}<input type="search" id="fin-q" placeholder="Buscar concepto o clienta…" value="${esc(FIN.q)}" oninput="FIN.q=this.value; FIN.lim=50; pintarMovs()"></div>
      <select class="sel" onchange="FIN.tipo=this.value; FIN.cat=''; RENDER.finanzas()"><option value="">Ingresos y egresos</option><option value="ing" ${FIN.tipo === 'ing' ? 'selected' : ''}>Solo ingresos</option><option value="egr" ${FIN.tipo === 'egr' ? 'selected' : ''}>Solo egresos</option></select>
      <select class="sel" onchange="FIN.cat=this.value; pintarMovs()"><option value="">Todas las categorías</option>${(FIN.tipo === 'egr' ? CAT_EGRESO : FIN.tipo === 'ing' ? CAT_INGRESO : CAT_INGRESO.concat(CAT_EGRESO)).map(c => `<option ${FIN.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <select class="sel" onchange="FIN.medio=this.value; pintarMovs()"><option value="">Todos los medios</option>${MEDIOS_PAGO.map(m => `<option ${FIN.medio === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
    </div>
    <div class="tabla-caja" id="fin-movs"></div>`;
  pintarMovs();
  if (window.innerWidth < 900) $('#fin-g1').style.gridTemplateColumns = 'minmax(0,1fr)';
};
function pintarMovs(){
  const lista = movsFiltrados();
  $('#fin-movs').innerHTML = lista.length ? `<div class="tabla-scroll"><table class="tabla"><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Medio</th><th class="derecha">Monto</th></tr></thead><tbody>
    ${lista.slice(0, FIN.lim).map(m => { const c = m.cli ? cliente(m.cli) : null; return `<tr class="clic" onclick="verMov('${m.id}')">

    </tbody></table></div>${lista.length > FIN.lim ? `<div class="mas-filas"><button class="btn btn-linea btn-sm" onclick="FIN.lim+=50; pintarMovs()">Ver más (${lista.length - FIN.lim})</button></div>` : ''}`
    : `<div class="vacio">${ico('finanzas')}No hay movimientos con esos filtros.</div>`;
}

/* Gráfico de barras (SVG, sin librerías) */
function graficoFin(){
  let meses = [];
  if (FIN.vista === 'anio'){ const y = FIN.fecha.slice(0, 4); for (let m = 1; m <= 12; m++) meses.push(y + '-' + p2(m)); }
  else for (let k = 5; k >= 0; k--) meses.push(mesClave(sumarMeses(FIN.fecha, -k)));
  const datos = meses.map(mk => { const l = D().movs.filter(m => mesClave(m.fecha) === mk && m.cat !== CAT_RETIRO); return { mk, ing:sumaMovs(l, 'ing'), egr:sumaMovs(l, 'egr') }; });
  const max = Math.max(1, ...datos.map(x => Math.max(x.ing, x.egr))) * 1.12;
  const W = 640, H = 240, izq = 54, abajo = 26, arr = 10, ancho = (W - izq - 6) / datos.length, bw = Math.min(26, ancho * .3);
  const y = v => arr + (H - arr - abajo) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = max / 1.12 * i / 4; g += `<line x1="${izq}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#F0E9E1"/><text x="${izq - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? Math.round(v / 1000) + ' k' : Math.round(v)}</text>`; }
  datos.forEach((x, i) => {
    const cx = izq + ancho * i + ancho / 2, d = aFecha(x.mk + '-01');
    g += `<g class="mes"><title>${MESES[d.getMonth()]}: ingresos ${pesos(x.ing)} · egresos ${pesos(x.egr)} · resultado ${pesos(x.ing - x.egr)}</title>
      <rect class="b-ing" x="${cx - bw - 2}" y="${y(x.ing)}" width="${bw}" height="${Math.max(0, H - abajo - y(x.ing))}" rx="4"/>
      <rect class="b-egr" x="${cx + 2}" y="${y(x.egr)}" width="${bw}" height="${Math.max(0, H - abajo - y(x.egr))}" rx="4"/>
      <text x="${cx}" y="${H - 8}" text-anchor="middle" ${x.mk === mesClave(FIN.fecha) ? 'style="fill:var(--grafito);font-weight:700"' : ''}>${MESES_C[d.getMonth()]}</text></g>`;
  });
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ingresos y egresos por mes">
    <defs><linearGradient id="gradOro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4A58C"/><stop offset="1" stop-color="#A8705A"/></linearGradient></defs>${g}</svg>`;
}

      ${esIng ? campo('Clienta (opcional)', sel('cli', [['', '—']].concat(D().clientes.slice().sort((a, b) => a.nombre.localeCompare(b.nombre)).map(c => [c.id, c.nombre])), m.cli), { ancho:true }) : ''}
    </form>`,

function guardarMov(tipo, id){
  const v = leerForm($('#f-mov'));
  if (!v.concepto) return avisar('Escribí el concepto', 'alerta');
  if (!(v.monto > 0)) return avisar('Poné el monto', 'alerta');

/* ===== js/12-flujo.js ===== */
/* =====================================================================
   FINANZAS → FLUJO DE FONDOS
   Mes a mes: saldo inicial + ingresos − egresos = saldo final.
   Últimos 6 meses (reales) + próximos 3 meses (proyectados).
   Proyección ORIENTATIVA: promedio de los últimos 3 meses cerrados, más los
   turnos ya agendados, el sueldo y el aguinaldo en el mes que corresponde.
   ===================================================================== */
function pestanasFin(){
  const m = FIN.modo || 'resumen';
  return `<div class="pestanas">
    <button class="pestana ${m === 'resumen' ? 'on' : ''}" onclick="FIN.modo='resumen'; RENDER.finanzas(); activarRevelado()">${ico('finanzas')} Resumen y movimientos</button>
    <button class="pestana ${m === 'flujo' ? 'on' : ''}" onclick="FIN.modo='flujo'; RENDER.finanzas(); activarRevelado()">${ico('dinero')} Flujo de fondos</button></div>`;
}
const saldoInicialCaja = () => { const s = D().config.saldoInicial; return typeof s === 'number' ? s : 120000; };
const signo = m => m.tipo === 'ing' ? m.monto : -m.monto;
function saldoAl(fecha){ return saldoInicialCaja() + D().movs.reduce((s, m) => s + (m.fecha < fecha ? signo(m) : 0), 0); }

function calcFlujo(){
  const h = hoy(), mesHoy = inicioMes(h), f = D().func;
  const porCat = (mk, tipo) => { const o = {}; D().movs.forEach(m => { if (m.tipo === tipo && mesClave(m.fecha) === mk) o[m.cat] = (o[m.cat] || 0) + m.monto; }); return o; };
  const cols = [];
  // Reales: 5 meses cerrados + el mes en curso
  for (let k = 5; k >= 0; k--){
    const ini = sumarMeses(mesHoy, -k), mk = mesClave(ini);
    cols.push({ ini, mk, tipo: k === 0 ? 'curso' : 'real', ing:porCat(mk, 'ing'), egr:porCat(mk, 'egr') });
  }
  // Promedio de los últimos 3 meses cerrados, por categoría
  const cerrados = cols.slice(2, 5), prom = tipo => { const o = {}; cerrados.forEach(c => Object.keys(c[tipo]).forEach(k => o[k] = (o[k] || 0) + c[tipo][k] / 3)); return o; };
  const pIng = prom('ing'), pEgr = prom('egr'), ag = calcAguinaldo();
  const sueldoBase = f.modalidad === 'mensual' ? Number(f.sueldo) : Number(f.jornal) * 24;
  for (let k = 1; k <= 3; k++){
    const ini = sumarMeses(mesHoy, k), mk = mesClave(ini);
    const ing = {}, egr = {};
    Object.keys(pIng).forEach(c => ing[c] = Math.round(pIng[c]));
    const agendado = D().turnos.filter(t => mesClave(t.fecha) === mk && (t.estado === 'pendiente' || t.estado === 'confirmado')).reduce((s, t) => s + t.precio, 0);
    ing['Servicios'] = Math.max(ing['Servicios'] || 0, agendado);
    Object.keys(pEgr).forEach(c => egr[c] = Math.round(pEgr[c]));
    egr['Sueldos'] = sueldoBase + (mesClave(ag.pago) === mk ? ag.estimado : 0);
    cols.push({ ini, mk, tipo:'proy', ing, egr, agendado, aguinaldo: mesClave(ag.pago) === mk ? ag.estimado : 0 });
  }
  // Saldos encadenados
  let saldo = saldoAl(cols[0].ini);
  cols.forEach(c => {
    c.tIng = Object.values(c.ing).reduce((s, v) => s + v, 0);
    c.tEgr = Object.values(c.egr).reduce((s, v) => s + v, 0);
    c.neto = c.tIng - c.tEgr; c.saldoIni = saldo; saldo += c.neto; c.saldoFin = saldo;
  });
  return cols;
}

function htmlFlujo(){
  const cols = calcFlujo(), h = hoy(), cur = cols[5], proy = cols.slice(6);
  const saldoHoy = saldoAl(sumarDias(h, 1));
  const peor = proy.reduce((a, c) => c.neto < a.neto ? c : a, proy[0]);
  const conAg = proy.find(c => c.aguinaldo);
  const nomMes = c => MESES_C[aFecha(c.ini).getMonth()] + (c.ini.slice(0, 4) !== h.slice(0, 4) ? ' ' + c.ini.slice(2, 4) : '');
  const filasCat = (tipo, lista) => lista.filter(cat => cols.some(c => c[tipo][cat])).map(cat =>
    `<tr class="sub"><td>${esc(cat)}</td>${cols.map(c => `<td class="${c.tipo === 'proy' ? 'proy' : ''}">${c[tipo][cat] ? pesos(c[tipo][cat]) : '<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('');
  const fila = (clase, t, fn) => `<tr class="${clase}"><td>${t}</td>${cols.map(c => `<td class="${c.tipo === 'proy' ? 'proy' : ''}">${fn(c)}</td>`).join('')}</tr>`;

  return `<div class="grid g-4 revelar">
      <div class="kpi"><div class="kpi-l">${ico('dinero')} Saldo hoy</div><div class="kpi-v">${pesos(saldoHoy)}</div><div class="kpi-d">caja y bancos</div></div>
      <div class="kpi"><div class="kpi-l">${ico('finanzas')} Flujo del mes</div><div class="kpi-v ${cur.neto >= 0 ? 'pos' : ''}">${pesos(cur.neto)}</div><div class="kpi-d">${MESES[aFecha(cur.ini).getMonth()]}, a hoy</div></div>
      <div class="kpi"><div class="kpi-l">${ico('agenda')} Saldo en 3 meses</div><div class="kpi-v">${pesos(proy[2].saldoFin)}</div><div class="kpi-d">proyectado a fin de ${MESES[aFecha(proy[2].ini).getMonth()]}</div></div>
      <div class="kpi ${peor.neto < 0 ? 'alerta' : ''}"><div class="kpi-l">${ico('alerta')} Mes más ajustado</div><div class="kpi-v" style="text-transform:capitalize">${MESES[aFecha(peor.ini).getMonth()]}</div>
        <div class="kpi-d">flujo proyectado ${pesos(peor.neto)}${peor.aguinaldo ? ' (paga aguinaldo)' : ''}</div></div>
    </div>
    <div class="card mt revelar"><div class="card-cab"><div class="card-t">Saldo mes a mes<small>Barras: lo que entra menos lo que sale · línea: saldo a fin de mes</small></div>
      <div class="graf-ley"><span><i style="background:var(--oro)"></i>Flujo del mes</span><span><i style="background:var(--grafito);height:2px;vertical-align:3px"></i>Saldo</span><span><i style="background:var(--oro-suave);border:1px dashed var(--oro)"></i>Proyectado</span></div></div>
      ${graficoFlujo(cols, nomMes)}</div>
    <div class="card-cab" style="margin-top:28px"><div class="card-t">Flujo de fondos<small>Últimos 6 meses reales y los próximos 3 proyectados</small></div>
      <button class="btn btn-linea btn-sm" onclick="formSaldoCaja()">${ico('editar')} Ajustar saldo de hoy</button></div>
    <div class="tabla-caja revelar"><div class="tabla-scroll"><table class="tabla flujo">
      <thead><tr><th>Concepto</th>${cols.map(c => `<th class="${c.tipo === 'proy' ? 'proy' : ''}">${nomMes(c)}<small>${c.tipo === 'proy' ? 'Proyectado' : c.tipo === 'curso' ? 'En curso' : 'Real'}</small></th>`).join('')}</tr></thead>
      <tbody>
        ${fila('saldo', 'Saldo al inicio', c => pesos(c.saldoIni))}
        <tr class="grupo"><td colspan="${cols.length + 1}">Ingresos</td></tr>
        ${filasCat('ing', CAT_INGRESO)}
        ${fila('tot', 'Total ingresos', c => `<span class="pos">${pesos(c.tIng)}</span>`)}
        <tr class="grupo"><td colspan="${cols.length + 1}">Egresos</td></tr>
        ${filasCat('egr', CAT_EGRESO)}
        ${fila('tot', 'Total egresos', c => `<span class="neg">${pesos(c.tEgr)}</span>`)}
        ${fila('neto', 'Flujo del mes', c => `<span class="${c.neto >= 0 ? 'pos' : 'neg'}">${c.neto >= 0 ? '+' : '−'} ${pesos(Math.abs(c.neto))}</span>`)}
        ${fila('saldo', 'Saldo al final', c => pesos(c.saldoFin))}
      </tbody></table></div></div>
    <div class="caja-info mt">${ico('info')}<div><b>Cómo se proyecta:</b> ingresos y gastos con el promedio de los últimos 3 meses cerrados; los servicios nunca por debajo de los turnos ya agendados;
      el sueldo de ${esc(primerNombre(D().func.nombre))} cada mes${conAg ? ` y el <b>aguinaldo (${pesos(conAg.aguinaldo)})</b> en ${MESES[aFecha(conAg.ini).getMonth()]}` : ''}. El mes en curso muestra lo real hasta hoy.</div></div>
    <div class="orientativo">Proyección orientativa: sirve para anticipar meses ajustados, no reemplaza el control del banco.</div>`;
}

function graficoFlujo(cols, nomMes){
  const W = 720, H = 250, izq = 64, abajo = 28, arr = 14, n = cols.length, ancho = (W - izq - 8) / n, bw = Math.min(30, ancho * .42);
  const vals = cols.map(c => c.neto).concat(cols.map(c => c.saldoFin), [0]);
  const max = Math.max(...vals) * 1.1, min = Math.min(0, ...vals) * 1.1 || 0;
  const y = v => arr + (H - arr - abajo) * (max - v) / (max - min);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = min + (max - min) * i / 4; g += `<line x1="${izq}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#F0E9E1"/><text x="${izq - 8}" y="${y(v) + 4}" text-anchor="end">${Math.abs(v) >= 1000 ? Math.round(v / 1000) + ' k' : Math.round(v)}</text>`; }
  g += `<line x1="${izq}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#D9CFC4"/>`;
  const cx = i => izq + ancho * i + ancho / 2;
  cols.forEach((c, i) => {
    const pr = c.tipo === 'proy', top = y(Math.max(0, c.neto)), alto = Math.abs(y(c.neto) - y(0));
    g += `<g class="mes"><title>${nomMes(c)}${pr ? ' (proyectado)' : ''}: flujo ${pesos(c.neto)} · saldo ${pesos(c.saldoFin)}</title>
      <rect x="${cx(i) - bw / 2}" y="${top}" width="${bw}" height="${Math.max(1, alto)}" rx="4" fill="${c.neto < 0 ? 'var(--mal)' : pr ? 'var(--oro-suave)' : 'url(#gradOroF)'}" ${pr ? 'stroke="var(--oro)" stroke-dasharray="3 3"' : ''}/>
      <text x="${cx(i)}" y="${H - 8}" text-anchor="middle" ${c.tipo === 'curso' ? 'style="fill:var(--grafito);font-weight:700"' : ''}>${nomMes(c)}</text></g>`;
  });
  const pts = cols.map((c, i) => cx(i) + ',' + y(c.saldoFin));
  g += `<polyline points="${pts.slice(0, 6).join(' ')}" fill="none" stroke="var(--grafito)" stroke-width="2"/>
    <polyline points="${pts.slice(5).join(' ')}" fill="none" stroke="var(--grafito)" stroke-width="2" stroke-dasharray="5 5" opacity=".6"/>
    ${cols.map((c, i) => `<circle cx="${cx(i)}" cy="${y(c.saldoFin)}" r="3.5" fill="${c.tipo === 'proy' ? '#fff' : 'var(--grafito)'}" stroke="var(--grafito)" stroke-width="1.5"/>`).join('')}`;
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico del flujo de fondos y el saldo mes a mes">
    <defs><linearGradient id="gradOroF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4A58C"/><stop offset="1" stop-color="#A8705A"/></linearGradient></defs>${g}</svg>`;
}

function formSaldoCaja(){
  const actual = saldoAl(sumarDias(hoy(), 1));
  abrirModal({
    titulo: 'Saldo de caja y bancos', sub: 'Poné cuánta plata hay hoy entre efectivo y cuentas: el flujo se acomoda solo.',
    cuerpo: `<form class="form" id="f-saldo" onsubmit="guardarSaldoCaja(); return false">
      ${campo('Saldo de hoy', inp('saldo', Math.round(actual), 'number', 'step="100"'), { ancho:true, ayuda:'Según los movimientos cargados, hoy deberías tener ' + pesos(actual) + '.' })}</form>`,
    pie: `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="guardarSaldoCaja()">Guardar</button>`
  });
}
function guardarSaldoCaja(){
  const v = Number(leerForm($('#f-saldo')).saldo);
  if (isNaN(v)) return avisar('Poné un monto', 'alerta');
  D().config.saldoInicial = saldoInicialCaja() + (v - saldoAl(sumarDias(hoy(), 1)));
  guardar(); cerrarModal(); refrescar(); avisar('Saldo actualizado: ' + pesos(v), 'dinero');
}
function exportarFlujo(){
  const cols = calcFlujo(), filas = [];
  const cats = (tipo, lista) => lista.filter(cat => cols.some(c => c[tipo][cat])).forEach(cat => filas.push(['  ' + cat].concat(cols.map(c => Math.round(c[tipo][cat] || 0)))));
  filas.push(['Saldo al inicio'].concat(cols.map(c => Math.round(c.saldoIni))));
  filas.push(['INGRESOS']); cats('ing', CAT_INGRESO); filas.push(['Total ingresos'].concat(cols.map(c => Math.round(c.tIng))));
  filas.push(['EGRESOS']); cats('egr', CAT_EGRESO); filas.push(['Total egresos'].concat(cols.map(c => Math.round(c.tEgr))));
  filas.push(['Flujo del mes'].concat(cols.map(c => Math.round(c.neto))));
  filas.push(['Saldo al final'].concat(cols.map(c => Math.round(c.saldoFin))));
  exportarCSV('Flujo de fondos', ['Concepto'].concat(cols.map(c => fMes(c.ini) + (c.tipo === 'proy' ? ' (proyectado)' : c.tipo === 'curso' ? ' (en curso)' : ''))), filas);
}

function detalleCompra(c){ return c.items.length ? c.items.map(it => it.cant + ' × ' + (producto(it.prod) || { nombre:'?' }).nombre).join(', ') : c.concepto; }
function pintarProveedores(){

    ${lista.map(p => { const cs = D().compras.filter(c => c.prov === p.id), u = cs.reduce((m, c) => !m || c.fecha > m ? c.fecha : m, null);

    </tbody></table></div>` : `<div class="vacio">${ico('proveedores')}No hay proveedores con esa búsqueda.</div>`;

}
function verProveedor(id){

  abrirModal({
    titulo: esc(p.razon), sub: esc(p.rubro), ancho:'md',

        ${d('Total comprado', pesos(cs.reduce((s, c) => s + c.total, 0)))}${d('Compras', cs.length)}</div>

      ${prods.length ? `<div class="form-sep" style="margin:20px 0 10px">Productos que provee</div><div class="fila">${prods.map(x => `<span class="chip ${x.tipo === 'venta' ? 'c-oro' : 'c-gris'} sin-punto">${esc(x.nombre)}</span>`).join('')}</div>` : ''}
      <div class="form-sep" style="margin:20px 0 6px">Compras</div>
      ${cs.length ? cs.slice(0, 20).map(c => `<div class="hist-item"><div class="fuerte">${fMedia(c.fecha)}</div><div class="t2">${esc(detalleCompra(c))}</div><div class="num fuerte">${pesos(c.total)}</div></div>`).join('') : '<div class="vacio">Todavía no hay compras.</div>'}`,
    pie: `<button class="btn btn-linea izq" onclick="formProveedor('${id}')">${ico('editar')} Editar</button>
      <button class="btn btn-wa" onclick="abrirWhatsApp('${esc(p.tel)}','Hola ${esc(primerNombre(p.contacto))}, te escribo de AURA Estética. ')">${ico('wa')} WhatsApp</button>
      <button class="btn btn-oro" onclick="formCompra('${id}')">${ico('carrito')} Nueva compra</button>`
  });
}
function formProveedor(id){
  const p = id ? proveedor(id) : { razon:'', contacto:'', tel:'', email:'', rut:'', rubro:'', obs:'' };
  abrirModal({
    titulo: id ? 'Editar proveedor' : 'Nuevo proveedor',

      ${campo('Contacto', inp('contacto', p.contacto))}${campo('Teléfono', inp('tel', p.tel, 'tel'))}
      ${campo('Email', inp('email', p.email, 'email'))}${campo('RUT', inp('rut', p.rut))}
      ${campo('Rubro / qué productos provee', inp('rubro', p.rubro), { ancho:true })}

function guardarProveedor(id){
