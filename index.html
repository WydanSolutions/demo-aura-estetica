/* ---------- Nueva compra ---------- */
function formCompra(provId){
  const pv = provId || D().proveedores[0].id;
  abrirModal({
    titulo: 'Nueva compra', sub: 'Suma al stock, actualiza el costo y se registra como egreso en Finanzas.', ancho:'md',
    cuerpo: `<form class="form" id="f-compra" onsubmit="return false">
      ${campo('Proveedor', sel('prov', D().proveedores.map(p => [p.id, p.razon]), pv, 'onchange="reiniciarItems()"'), { ancho:true })}
      ${campo('Fecha', inp('fecha', hoy(), 'date'))}${campo('Medio de pago', sel('medio', MEDIOS_PAGO, 'Transferencia'))}
      <div class="items-compra"><div class="campo"><label>Productos</label></div>
        <div class="item-fila muted" style="font-size:11px;margin-bottom:4px"><span>Producto</span><span>Cant.</span><span>Costo unit.</span><span></span></div>
        <div id="items"></div>
        <button class="btn btn-suave btn-sm" type="button" onclick="agregarItem()">${ico('mas')} Agregar producto</button></div>
      ${campo('Otro concepto (sin productos)', inp('concepto', '', 'text', 'placeholder="Ej.: mantenimiento del equipo láser"'), { ancho:true })}
      ${campo('Monto del otro concepto', inp('montoExtra', '', 'number', 'min="0" oninput="totalCompra()"'))}
      <div class="campo"><label>Total de la compra</label><div id="compra-total" style="font-family:var(--f-titulo);font-size:30px;font-weight:600;line-height:1.2">$ 0</div></div>
    </form>`,
    pie: `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="guardarCompra()">${ico('ok')} Registrar compra</button>`,
    alAbrir: () => reiniciarItems()
  });
}
function reiniciarItems(){ $('#items').innerHTML = ''; agregarItem(); }
function agregarItem(){
  const pv = $('#f-compra [name=prov]').value;
  const prods = D().productos.slice().sort((a, b) => (b.prov === pv) - (a.prov === pv) || a.nombre.localeCompare(b.nombre));
  const div = document.createElement('div'); div.className = 'item-fila';
  div.innerHTML = `<select data-i="prod" onchange="this.parentNode.querySelector('[data-i=costo]').value = producto(this.value).costo; totalCompra()">
      ${prods.map(p => `<option value="${p.id}">${esc(p.nombre)}${p.prov === pv ? '' : ' (otro prov.)'}</option>`).join('')}</select>
    <input data-i="cant" type="number" min="1" value="6" oninput="totalCompra()"><input data-i="costo" type="number" min="0" value="${prods[0].costo}" oninput="totalCompra()">
    <button type="button" class="icon-btn" onclick="this.parentNode.remove(); totalCompra()" aria-label="Quitar">${ico('x')}</button>`;
  $('#items').appendChild(div); totalCompra();
}
function itemsCompra(){ return $$('#items .item-fila').map(f => ({ prod:f.querySelector('[data-i=prod]').value, cant:Number(f.querySelector('[data-i=cant]').value) || 0, costo:Number(f.querySelector('[data-i=costo]').value) || 0 })).filter(i => i.cant > 0); }
function totalCompra(){
  const t = itemsCompra().reduce((s, i) => s + i.cant * i.costo, 0) + (Number($('#f-compra [name=montoExtra]').value) || 0);
  $('#compra-total').textContent = pesos(t); return t;
}
function guardarCompra(){
  const v = leerForm($('#f-compra')), items = itemsCompra(), total = totalCompra();
  if (!(total > 0)) return avisar('Agregá al menos un producto o un monto', 'alerta');
  const p = proveedor(v.prov), cid = Store.id('cp');
  const mov = nuevoMov({ fecha:v.fecha, tipo:'egr', cat:'Proveedores', concepto:'Compra a ' + p.razon, monto:total, medio:v.medio, compra:cid, prov:p.id });
  D().compras.push({ id:cid, fecha:v.fecha, prov:p.id, items, concepto:v.concepto, total, medio:v.medio, mov:mov.id });
  items.forEach(i => { moverStock(i.prod, i.cant, 'Compra a ' + p.razon, v.fecha); producto(i.prod).costo = i.costo; });
  guardar(); cerrarModal(); refrescar();
  avisar('Compra registrada: ' + pesos(total) + (items.length ? ' · stock actualizado' : ''), 'carrito');
}
function exportarProveedores(){
  exportarCSV('Proveedores', ['Razón social','Contacto','Teléfono','Email','RUT','Rubro','Observaciones','Total comprado'],
    D().proveedores.map(p => [p.razon, p.contacto, p.tel, p.email, p.rut, p.rubro, p.obs, D().compras.filter(c => c.prov === p.id).reduce((s, c) => s + c.total, 0)]));
}


/* ===== js/14-stock.js ===== */
/* =====================================================================
   STOCK · productos de venta e insumos de cabina (pestañas separadas)
   ===================================================================== */
const STK = { tab:'venta', soloBajo:false, q:'' };
const MOTIVOS_AJUSTE = ['Uso en cabina','Vencido o roto','Muestra o regalo','Ajuste de inventario','Devolución','Otro'];

RENDER.stock = function(){
  encabezado('Stock', 'Lo que vendés y lo que usás en cabina, con aviso cuando algo llega al mínimo.',
    btnExportar('exportarStock') + `<button class="btn btn-linea" onclick="formAjuste()">${ico('ajuste')} Ajustar stock</button>
    <button class="btn btn-linea" onclick="formCompra()">${ico('carrito')} Nueva compra</button>
    <button class="btn btn-oro" onclick="formProducto()">${ico('mas')} Nuevo producto</button>`);
  const deTab = D().productos.filter(p => p.tipo === STK.tab);
  const bajos = deTab.filter(p => estadoStock(p) !== 'ok');
  const valor = deTab.reduce((s, p) => s + p.stock * p.costo, 0);
  const n = t => D().productos.filter(p => p.tipo === t).length, nb = t => D().productos.filter(p => p.tipo === t && estadoStock(p) !== 'ok').length;
  const venta = STK.tab === 'venta';
  const margenProm = venta && deTab.length ? deTab.reduce((s, p) => s + (p.precio ? (p.precio - p.costo) / p.precio * 100 : 0), 0) / deTab.length : 0;
  const desde = sumarDias(hoy(), -30);
  const vendidos = D().movs.filter(m => m.cat === 'Venta de productos' && m.fecha >= desde);
  $('#vista').innerHTML = `
    <div class="pestanas">
      <button class="pestana ${venta ? 'on' : ''}" onclick="STK.tab='venta'; RENDER.stock(); activarRevelado()">${ico('carrito')} Productos de venta <span class="n">${n('venta')}</span>${nb('venta') ? `<span class="chip c-mal sin-punto">${nb('venta')} bajo</span>` : ''}</button>
      <button class="pestana ${!venta ? 'on' : ''}" onclick="STK.tab='insumo'; RENDER.stock(); activarRevelado()">${ico('stock')} Insumos de cabina <span class="n">${n('insumo')}</span>${nb('insumo') ? `<span class="chip c-mal sin-punto">${nb('insumo')} bajo</span>` : ''}</button>
    </div>
    <div class="grid g-4 revelar">
      <div class="kpi"><div class="kpi-l">${ico('stock')} Productos</div><div class="kpi-v">${deTab.length}</div><div class="kpi-d">${deTab.reduce((s, p) => s + p.stock, 0)} unidades en total</div></div>
      <div class="kpi"><div class="kpi-l">${ico('dinero')} Valor a costo</div><div class="kpi-v">${pesos(valor)}</div><div class="kpi-d">lo invertido en stock</div></div>
      <div class="kpi ${bajos.length ? 'alerta' : ''}"><div class="kpi-l">${ico('alerta')} Stock bajo</div><div class="kpi-v">${bajos.length}</div><div class="kpi-d">${bajos.filter(p => p.stock <= 0).length} sin stock</div></div>
      ${venta ? `<div class="kpi"><div class="kpi-l">${ico('finanzas')} Vendido (30 días)</div><div class="kpi-v">${pesos(vendidos.reduce((s, m) => s + m.monto, 0))}</div><div class="kpi-d">margen promedio ${pct(margenProm)}</div></div>`
        : `<div class="kpi"><div class="kpi-l">${ico('ajuste')} Usos (30 días)</div><div class="kpi-v">${D().ajustes.filter(a => a.fecha >= desde && a.cant < 0 && producto(a.prod) && producto(a.prod).tipo === 'insumo').length}</div><div class="kpi-d">salidas registradas</div></div>`}
    </div>
    <div class="herr mt">
      <div class="buscar">${ico('buscar')}<input type="search" placeholder="Buscar producto…" value="${esc(STK.q)}" oninput="STK.q=this.value; pintarStock()"></div>
      <label class="interruptor"><input type="checkbox" ${STK.soloBajo ? 'checked' : ''} onchange="STK.soloBajo=this.checked; pintarStock()"> Solo stock bajo</label>
    </div>
    <div class="tabla-caja revelar" id="stk-lista"></div>
    <div class="card-cab" style="margin-top:28px"><div class="card-t">Movimientos de stock<small>Últimas entradas y salidas de ${venta ? 'productos de venta' : 'insumos'}</small></div></div>
    <div class="tabla-caja revelar" id="stk-movs"></div>`;
  pintarStock();
  const movs = D().ajustes.filter(a => producto(a.prod) && producto(a.prod).tipo === STK.tab).sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 12);
  $('#stk-movs').innerHTML = movs.length ? `<div class="tabla-scroll"><table class="tabla"><thead><tr><th>Fecha</th><th>Producto</th><th>Motivo</th><th class="derecha">Cantidad</th></tr></thead><tbody>
    ${movs.map(a => `<tr><td class="num">${fCorta(a.fecha)}</td><td class="fuerte">${esc(producto(a.prod).nombre)}</td><td class="t2">${esc(a.motivo)}</td>
      <td class="derecha num fuerte ${a.cant > 0 ? 'pos' : 'neg'}">${a.cant > 0 ? '+' : ''}${a.cant}</td></tr>`).join('')}</tbody></table></div>`
    : `<div class="vacio">Sin movimientos recientes.</div>`;
};
function pintarStock(){
  const venta = STK.tab === 'venta', q = STK.q.toLowerCase();
  const orden = { sin:0, bajo:1, ok:2 };
  const lista = D().productos.filter(p => p.tipo === STK.tab && (!STK.soloBajo || estadoStock(p) !== 'ok') && (!q || p.nombre.toLowerCase().includes(q)))
    .sort((a, b) => orden[estadoStock(a)] - orden[estadoStock(b)] || a.nombre.localeCompare(b.nombre));
  $('#stk-lista').innerHTML = lista.length ? `<div class="tabla-scroll"><table class="tabla"><thead><tr><th>Producto</th><th>Stock</th><th class="derecha">Mínimo</th><th class="derecha">Costo</th>
      ${venta ? '<th class="derecha">Precio</th><th class="derecha">Margen</th>' : ''}<th>Estado</th><th class="derecha">Acciones</th></tr></thead><tbody>
    ${lista.map(p => { const e = estadoStock(p), pv = proveedor(p.prov);
      return `<tr><td><div class="fuerte">${esc(p.nombre)}</div><div class="persona-s">${pv ? esc(pv.razon) : '—'}</div></td>
        <td style="min-width:110px"><div class="fuerte num">${p.stock}</div><div class="avance ${e === 'ok' ? 'ok' : e === 'sin' ? 'mal' : ''}" style="height:5px;margin-top:4px;max-width:90px"><span style="width:${Math.min(100, p.stock / Math.max(1, p.min * 2.5) * 100)}%;${e === 'bajo' ? 'background:var(--pend)' : ''}"></span></div></td>
        <td class="derecha num">${p.min}</td><td class="derecha num">${pesos(p.costo)}</td>
        ${venta ? `<td class="derecha num fuerte">${pesos(p.precio)}</td><td class="derecha num">${p.precio ? pct((p.precio - p.costo) / p.precio * 100) : '—'}</td>` : ''}
        <td>${chipStock(p)}</td>
        <td class="derecha" style="white-space:nowrap">
          ${venta ? `<button class="btn btn-suave btn-xs" onclick="nuevaVenta('${p.id}')" ${p.stock <= 0 ? 'disabled' : ''}>${ico('carrito')} Vender</button>` : ''}
          <button class="btn btn-linea btn-xs" onclick="formAjuste('${p.id}')">${ico('ajuste')} Ajustar</button>
          <button class="icon-btn" style="width:30px;height:30px" onclick="formProducto('${p.id}')" aria-label="Editar">${ico('editar')}</button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="vacio">${ico('stock')}${STK.soloBajo ? '¡Nada con stock bajo!' : 'No hay productos con esa búsqueda.'}</div>`;
  $('#stk-lista').classList.add('visible');
}

function formProducto(id){
  const p = id ? producto(id) : { nombre:'', tipo:STK.tab, prov:D().proveedores[0].id, stock:0, min:2, costo:'', precio:'' };
  abrirModal({
    titulo: id ? 'Editar producto' : 'Nuevo producto',
    cuerpo: `<form class="form" id="f-prod" onsubmit="return false">
      ${campo('Nombre', inp('nombre', p.nombre), { ancho:true })}
      ${campo('Tipo', sel('tipo', [['venta','Producto de venta'],['insumo','Insumo de cabina']], p.tipo, 'onchange="$(\'#campo-precio\').style.display=this.value===\'venta\'?\'\':\'none\'"'))}
      ${campo('Proveedor', sel('prov', D().proveedores.map(x => [x.id, x.razon]), p.prov))}
      ${campo('Stock actual', inp('stock', p.stock, 'number', 'min="0"'))}
      ${campo('Stock mínimo', inp('min', p.min, 'number', 'min="0"'), { ayuda:'Cuando llega a este número, avisa.' })}
      ${campo('Costo', inp('costo', p.costo, 'number', 'min="0"'))}
      <div id="campo-precio" style="${p.tipo === 'venta' ? '' : 'display:none'}">${campo('Precio de venta', inp('precio', p.precio, 'number', 'min="0"'))}</div>
    </form>`,
    pie: (id ? `<button class="btn btn-peligro izq" onclick="borrarProducto('${id}')">${ico('borrar')} Eliminar</button>` : '') +
      `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="guardarProducto('${id || ''}')">Guardar</button>`
  });
}
function guardarProducto(id){
  const v = leerForm($('#f-prod')); if (!v.nombre) return avisar('Escribí el nombre', 'alerta');
  ['stock','min','costo','precio'].forEach(k => v[k] = Number(v[k]) || 0);
  if (v.tipo !== 'venta') v.precio = 0;
  if (id){ const p = producto(id); if (p.stock !== v.stock) D().ajustes.push({ id:Store.id('aj'), fecha:hoy(), prod:id, cant:v.stock - p.stock, motivo:'Corrección desde la ficha' }); Object.assign(p, v); }
  else { v.id = Store.id('pr'); D().productos.push(v); STK.tab = v.tipo; }
  guardar(); cerrarModal(); refrescar(); avisar('Producto guardado', 'stock');
}
async function borrarProducto(id){
  if (!(await confirmar('¿Eliminar el producto?', 'Se saca de la lista de stock.', 'Eliminar', true))) return;
  D().productos = D().productos.filter(p => p.id !== id); guardar(); cerrarModal(); refrescar(); avisar('Producto eliminado', 'borrar');
}
function formAjuste(prodId){
  const lista = D().productos.slice().sort((a, b) => (a.tipo === STK.tab ? 0 : 1) - (b.tipo === STK.tab ? 0 : 1) || a.nombre.localeCompare(b.nombre));
  abrirModal({
    titulo: 'Ajustar stock', sub: 'Entradas y salidas que no son compras ni ventas.',
    cuerpo: `<form class="form" id="f-aj" onsubmit="return false">
      ${campo('Producto', sel('prod', lista.map(p => [p.id, p.nombre + ' · hay ' + p.stock]), prodId || lista[0].id), { ancho:true })}
      ${campo('Movimiento', sel('sentido', [['-1','Salida (se descuenta)'],['1','Entrada (se suma)']], '-1'))}
      ${campo('Cantidad', inp('cant', 1, 'number', 'min="1"'))}
      ${campo('Motivo', sel('motivo', MOTIVOS_AJUSTE, 'Uso en cabina'))}
      ${campo('Fecha', inp('fecha', hoy(), 'date'))}</form>`,
    pie: `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="guardarAjuste()">Guardar ajuste</button>`
  });
}
function guardarAjuste(){
  const v = leerForm($('#f-aj')); if (!(v.cant > 0)) return avisar('Poné la cantidad', 'alerta');
  moverStock(v.prod, Number(v.sentido) * v.cant, v.motivo, v.fecha);
  const p = producto(v.prod);
  guardar(); cerrarModal(); refrescar();
  avisar(p.nombre + ': quedan ' + p.stock + (estadoStock(p) !== 'ok' ? ' · ¡stock bajo!' : ''), estadoStock(p) !== 'ok' ? 'alerta' : 'stock');
}

/* ---------- Venta de productos: descuenta stock y genera un ingreso ---------- */
function nuevaVenta(prodId){
  const lista = D().productos.filter(p => p.tipo === 'venta').sort((a, b) => a.nombre.localeCompare(b.nombre));
  const p0 = (prodId && producto(prodId)) || lista.find(p => p.stock > 0) || lista[0];
  abrirModal({
    titulo: 'Vender producto', sub: 'Descuenta del stock y suma el ingreso en Finanzas.',
    cuerpo: `<form class="form" id="f-venta" onsubmit="return false">
      ${campo('Producto', sel('prod', lista.map(p => [p.id, p.nombre + ' · ' + pesos(p.precio) + ' · hay ' + p.stock]), p0.id, 'onchange="$(\'#f-venta [name=precio]\').value=producto(this.value).precio; totalVenta()"'), { ancho:true })}
      ${campo('Cantidad', inp('cant', 1, 'number', 'min="1" oninput="totalVenta()"'))}
      ${campo('Precio unitario', inp('precio', p0.precio, 'number', 'min="0" oninput="totalVenta()"'))}
      ${campo('Clienta (opcional)', sel('cli', [['', '—']].concat(D().clientes.slice().sort((a, b) => a.nombre.localeCompare(b.nombre)).map(c => [c.id, c.nombre]))))}
      ${campo('Medio de pago', sel('medio', MEDIOS_PAGO, 'Efectivo'))}

   PERSONAL · asistencia, simulador de sueldo, pagos, aguinaldo y licencia

   TODOS LOS CÁLCULOS SON ORIENTATIVOS.

const PER = { tab:'asistencia', mes:null };

/* ---------- Cálculos ---------- */
function calcSueldo(mes){
  const f = D().func, r = D().config.reglas, ini = inicioMes(mes), fin = finMes(mes), h = hoy();
  const c = { P:0, F:0, FJ:0, M:0, L:0, FE:0 }; let sinMarcar = 0;
  for (let d = ini; d <= fin; d = sumarDias(d, 1)){ const a = D().asist[d]; if (a) c[a.e]++; else if (diaSemana(d) !== 0 && d < h) sinMarcar++; }
  const L = []; let total = 0;
  if (f.modalidad === 'mensual'){
    const jr = f.sueldo / r.divisorDia;
    L.push(['Sueldo base mensual', f.sueldo]); total = f.sueldo;
    const desc = (n, txt, factor) => { if (!n) return; const m = -Math.round(jr * factor * n); L.push([txt, m]); total += m; };
    desc(c.F, `${c.F} ${c.F === 1 ? 'falta' : 'faltas'} sin justificar (${pesos(f.sueldo)} ÷ ${r.divisorDia} = ${pesos(jr)} por día)`, 1);
    desc(c.M, `${c.M} medio ${c.M === 1 ? 'día' : 'días'} (la mitad de un día)`, r.factorMedioDia);
    if (r.descuentaJustificada) desc(c.FJ, `${c.FJ} faltas justificadas`, 1);
    if (r.descuentaLicencia) desc(c.L, `${c.L} días de licencia`, 1);
    if (r.descuentaFeriado) desc(c.FE, `${c.FE} feriados`, 1);
  } else {
    const j = Number(f.jornal);
    const suma = (n, txt, factor) => { if (!n) return; const m = Math.round(j * factor * n); L.push([txt, m]); total += m; };
    suma(c.P, `${c.P} días trabajados × ${pesos(j)}`, 1);
    suma(c.M, `${c.M} medio ${c.M === 1 ? 'día' : 'días'} × ${pesos(j * r.factorMedioDia)}`, r.factorMedioDia);
    if (!L.length) L.push(['Sin días trabajados marcados', 0]);
  }
  const adelT = D().pagos.filter(p => p.concepto === 'Adelanto' && mesClave(p.periodo) === mesClave(mes)).reduce((s, p) => s + p.monto, 0);
  return { L, total, adelT, aPagar: total - adelT, c, sinMarcar };
}
function calcAguinaldo(){
  const h = hoy(), y = aFecha(h).getFullYear(), f = D().func;
  const pagadoEn = f2 => D().pagos.some(p => p.concepto === 'Aguinaldo' && mesClave(p.fecha) === mesClave(f2));
  const cand = [y + '-06-30', y + '-12-20', (y + 1) + '-06-30'].find(x => x >= h && !pagadoEn(x)) || (y + 1) + '-06-30';
  const cy = +cand.slice(0, 4), junio = cand.slice(5, 7) === '06';
  const ini = junio ? (cy - 1) + '-12-01' : cy + '-06-01', fin = junio ? cy + '-05-31' : cy + '-11-30';
  const cobrado = D().pagos.filter(p => (p.concepto === 'Sueldo' || p.concepto === 'Adelanto') && p.periodo >= ini && p.periodo <= fin).reduce((s, p) => s + p.monto, 0);
  // meses del semestre con sueldo todavía sin pagar → se estiman con el sueldo actual
  let faltan = 0;
  for (let m = ini; m <= fin; m = sumarMeses(m, 1)) if (!D().pagos.some(p => p.concepto === 'Sueldo' && mesClave(p.periodo) === mesClave(m))) faltan++;
  const base = f.modalidad === 'mensual' ? Number(f.sueldo) : Number(f.jornal) * 24;
  const div = D().config.reglas.divisorAguinaldo;
  return { ini, fin, pago:cand, cobrado, acumulado:Math.round(cobrado / div), faltan, estimado:Math.round((cobrado + faltan * base) / div), base };
}
function calcLicencia(){
  const f = D().func, h = hoy(), r = D().config.reglas;
  const dias = difDias(f.ingreso, h), anios = Math.floor(dias / 365.25), meses = Math.floor(dias / 30.44);
  let generados, extra = 0;
  if (anios < 1) generados = Math.round(r.diasLicencia * meses / 12);
  else { extra = anios >= 5 ? 1 + Math.floor((anios - 5) / 4) : 0; generados = r.diasLicencia + extra; }
  const y = h.slice(0, 4);
  const registrados = Object.keys(D().asist).filter(k => k.startsWith(y) && D().asist[k].e === 'L').length;
  const tomados = (Number(f.licPrevia) || 0) + registrados, pend = Math.max(0, generados - tomados), jr = jornal();
  return { anios, meses, generados, extra, tomados, registrados, pend, jr, sv:Math.round(jr * generados), svPend:Math.round(jr * pend) };
}
function antiguedad(){ const l = calcLicencia(); const m = l.meses % 12; return (l.anios ? l.anios + (l.anios === 1 ? ' año' : ' años') : '') + (l.anios && m ? ' y ' : '') + (m || !l.anios ? m + (m === 1 ? ' mes' : ' meses') : ''); }
function proximosPagosPersonal(){
  const h = hoy(), f = D().func;

  return [

    { fecha:ag.pago, titulo:'Aguinaldo', detalle: pesos(ag.estimado) + ' estimado · hasta el ' + fCorta(ag.pago) }
  ].sort((a, b) => a.fecha.localeCompare(b.fecha));
}

/* =====================================================================
   CATÁLOGO DE SERVICIOS · base de la agenda, las finanzas y los tratamientos
   ===================================================================== */
const CAT = { cat:'', inactivos:false, q:'' };

function statsServicios(){
  const desde = sumarDias(hoy(), -365), st = {};
  D().servicios.forEach(s => st[s.id] = { n:0, t:0 });
  D().turnos.forEach(t => { if (t.estado === 'realizado' && t.fecha >= desde && st[t.serv]) st[t.serv].n++; });
  D().movs.forEach(m => { if (m.tipo === 'ing' && m.serv && m.fecha >= desde && st[m.serv]) st[m.serv].t += m.monto; });
  return st;
}
RENDER.catalogo = function(){
  encabezado('Catálogo de servicios', 'Precio, duración y sesiones de cada servicio. Al agendar, se completan solos.',
    btnExportar('exportarCatalogo') + `<button class="btn btn-oro" onclick="formServicio()">${ico('mas')} Nuevo servicio</button>`);
  const st = statsServicios(), q = CAT.q.toLowerCase();
  const lista = D().servicios.filter(s => (CAT.inactivos || s.activo) && (!CAT.cat || s.cat === CAT.cat) && (!q || s.nombre.toLowerCase().includes(q)));
  const grupos = CATEGORIAS_SERVICIO.filter(c => lista.some(s => s.cat === c));
  $('#vista').innerHTML = `<div class="herr">
      <div class="buscar">${ico('buscar')}<input type="search" placeholder="Buscar servicio…" value="${esc(CAT.q)}" oninput="CAT.q=this.value; RENDER.catalogo(); activarRevelado(); const i=$('#vista input[type=search]'); i.focus(); i.setSelectionRange(i.value.length,i.value.length)"></div>
      <div class="pildoras"><button class="pildora ${!CAT.cat ? 'on' : ''}" onclick="CAT.cat=''; RENDER.catalogo(); activarRevelado()">Todos</button>
        ${CATEGORIAS_SERVICIO.map(c => `<button class="pildora ${CAT.cat === c ? 'on' : ''}" onclick="CAT.cat='${c}'; RENDER.catalogo(); activarRevelado()">${c}</button>`).join('')}</div>
      <label class="interruptor"><input type="checkbox" ${CAT.inactivos ? 'checked' : ''} onchange="CAT.inactivos=this.checked; RENDER.catalogo(); activarRevelado()"> Mostrar inactivos</label>
    </div>
    ${grupos.length ? grupos.map(c => `<div class="cat-grupo"><div class="cat-grupo-t">${c} <span class="card-num">${lista.filter(s => s.cat === c).length}</span></div>
      <div class="serv-grid">${lista.filter(s => s.cat === c).sort((a, b) => st[b.id].t - st[a.id].t).map(s => `<div class="serv revelar ${s.activo ? '' : 'inactivo'}" onclick="formServicio('${s.id}')">
        <div class="fila-fin" style="align-items:flex-start"><div class="serv-n">${esc(s.nombre)}</div>${s.activo ? '' : '<span class="chip c-gris">Inactivo</span>'}</div>
        <div class="fila-fin"><div class="serv-p">${pesos(s.precio)}</div><span class="muted" style="font-size:12px">${ico('reloj')} ${s.dur} min</span></div>
        <div class="fila">${s.sesiones ? `<span class="chip c-oro sin-punto">${s.sesSug} sesiones · cada ${s.frec} días</span>` : '<span class="chip c-gris sin-punto">Sesión única</span>'}</div>
        <div class="serv-est"><span>Realizado<br><b>${st[s.id].n} veces</b></span><span style="text-align:right">Facturó (12 meses)<br><b>${pesos(st[s.id].t)}</b></span></div></div>`).join('')}</div></div>`).join('')
      : `<div class="vacio card">${ico('catalogo')}No hay servicios con ese filtro.</div>`}`;
};
function formServicio(id){
  const s = id ? servicio(id) : { nombre:'', cat:CAT.cat || 'Facial', dur:60, precio:'', sesiones:false, sesSug:6, frec:15, activo:true };
  abrirModal({
    titulo: id ? 'Editar servicio' : 'Nuevo servicio',
    cuerpo: `<form class="form" id="f-serv" onsubmit="return false">
      ${campo('Nombre', inp('nombre', s.nombre), { ancho:true })}
      ${campo('Categoría', sel('cat', CATEGORIAS_SERVICIO, s.cat))}
      ${campo('Duración (minutos)', inp('dur', s.dur, 'number', 'min="5" step="5"'))}
      ${campo('Precio', inp('precio', s.precio, 'number', 'min="0" step="50"'))}
      <div>${check('activo', s.activo, 'Activo (se puede agendar)')}</div>
      <div class="ancho">${check('sesiones', s.sesiones, 'Se hace <b>por sesiones</b> (tratamiento)', 'onchange="$(\'#serv-ses\').style.display=this.checked?\'\':\'none\'"')}</div>
      <div id="serv-ses" class="ancho form" style="${s.sesiones ? '' : 'display:none'}">
        ${campo('Sesiones sugeridas', inp('sesSug', s.sesSug, 'number', 'min="1"'))}${campo('Cada cuántos días', inp('frec', s.frec, 'number', 'min="1"'))}</div>
    </form>`,
    pie: `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="guardarServicio('${id || ''}')">Guardar</button>`
  });
}
function guardarServicio(id){
  const v = leerForm($('#f-serv'));
  if (!v.nombre) return avisar('Escribí el nombre', 'alerta');
  if (!(v.precio > 0) || !(v.dur > 0)) return avisar('Revisá la duración y el precio', 'alerta');
  ['dur','precio','sesSug','frec'].forEach(k => v[k] = Number(v[k]) || 0);
  if (id) Object.assign(servicio(id), v); else { v.id = Store.id('s'); D().servicios.push(v); }
  guardar(); cerrarModal(); refrescar(); avisar('Servicio guardado', 'catalogo');
}
function exportarCatalogo(){
  const st = statsServicios();
  exportarCSV('Catálogo de servicios', ['Servicio','Categoría','Duración (min)','Precio','Por sesiones','Sesiones sugeridas','Cada (días)','Activo','Realizado (12 meses)','Facturado (12 meses)'],
    D().servicios.map(s => [s.nombre, s.cat, s.dur, s.precio, s.sesiones ? 'Sí' : 'No', s.sesiones ? s.sesSug : '', s.sesiones ? s.frec : '', s.activo ? 'Sí' : 'No', st[s.id].n, Math.round(st[s.id].t)]));
}

function guardarConfigDatos(){
  const v = leerForm($('#cf-datos')), c = D().config;
  c.duena = v.duena || c.duena; c.diasInactiva = Number(v.diasInactiva) || 90;
  D().profesionales.forEach((p, i) => { if (v['prof' + i]) p.nombre = v['prof' + i]; });
  guardar(); refrescar(); avisar('Datos guardados', 'config');
}
function guardarConfigHorario(){
  const v = leerForm($('#cf-horario'));
  const dias = [0,1,2,3,4,5,6].filter(d => v['d' + d]);
  if (!dias.length) return avisar('Marcá al menos un día', 'alerta');
  if (minutos(v.hasta) <= minutos(v.desde)) return avisar('El horario de cierre tiene que ser después del de apertura', 'alerta');
  D().config.horario = { dias, desde:v.desde, hasta:v.hasta }; guardar(); avisar('Horario guardado', 'reloj');
}
function guardarConfigMensajes(){ Object.assign(D().config.mensajes, leerForm($('#cf-mensajes'))); guardar(); avisar('Mensajes guardados', 'wa'); }
function restaurarMensajes(){ D().config.mensajes = JSON.parse(JSON.stringify(CONFIG_INICIAL.mensajes)); guardar(); refrescar(); avisar('Se restauraron los textos originales', 'wa'); }
function guardarConfigReglas(){
  const v = leerForm($('#cf-reglas')), r = D().config.reglas;
  ['divisorDia','factorMedioDia','diasLicencia','divisorAguinaldo'].forEach(k => { if (Number(v[k]) > 0) r[k] = Number(v[k]); });
  ['descuentaJustificada','descuentaLicencia','descuentaFeriado'].forEach(k => r[k] = !!v[k]);
  guardar(); avisar('Reglas guardadas', 'personal');
}
